<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Stockholm Bostadsplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap">
<style>
/* Achromatic ledger: no colour in the chrome; verdigris (Gamla stan's copper roofs) is the one data hue.
   Shell: 48px top bar + underline tabs over a centred 1152px column. Grid: one 12px gap everywhere;
   bench = 380 + 12 + 760 = 1152; hero = 1.3fr/1fr of 1140 after the gap. */
:root {
  --ground: #f2f4f3;      /* granite-grey ground, one level off white */
  --surface: #ffffff;
  /* bidders, in the order they first bid (validated categorical order; labels and a table carry them too) */
  --bid-1: #2a78d6; --bid-2: #eb6834; --bid-3: #1baf7a; --bid-4: #eda100; --bid-5: #e87ba4; --bid-6: #008300; --bid-7: #6250d6; --bid-8: #e34948;
  --raised: #eef0ef;
  --active: #e6e9e8;
  --border: #e3e6e5;
  --rule: #edf0ef;
  --control: #d2d6d5;
  --text: #0a0a0a;
  --muted: #5d6462;
  --primary: #141414;
  --primary-ink: #ffffff;
  --data: #1f6b5a;        /* verdigris, the one chart hue */
  --data-soft: #e2eeea;
  --chart-2: #8a8f8d;
  --grid: #e5e7e6;
  --positive: #2e7d32;
  --negative: #c4242a;
  --warning: #92400e;
  --pill-positive-bg: #dcfae5; --pill-positive-ink: #04250e;
  --pill-negative-bg: #ffedea; --pill-negative-ink: #831c1e;
  --pill-warning-bg: #fffbeb; --pill-warning-ink: #92400e; --notice-border: #fde68a;
  --pill-neutral-bg: #eeeeee; --pill-neutral-ink: #3d3d3d;
  /* names used by the page's markup */
  --ink: var(--text); --line: var(--border); --sunk: var(--raised); --accent: var(--data); --accent-soft: var(--data-soft);
  --good: var(--positive); --warn: var(--warning); --bad: var(--negative);
  --s1: var(--chart-2); --s2: var(--chart-2); --s3: var(--chart-2); --s4: var(--chart-2);
  --f-body: "Geist", Inter, system-ui, sans-serif;
  --f-display: var(--f-body);
  --f-mono: var(--f-body);
  --r: 8px; --r-control: 6px;
  --gap: 12px; --pad: 24px; --control-height: 36px;
  --fs-title: 24px; --fs-section: 16px; --fs-kpi: 30px; --fs-body: 14px; --fs-small: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0b0b0b; --surface: #141414; --raised: #1c1c1c; --active: #262626; --border: #262626; --rule: #1f1f1f; --control: #3d3d3d;
  --bid-1: #3987e5; --bid-2: #d95926; --bid-3: #199e70; --bid-4: #c98500; --bid-5: #d55181; --bid-6: #008300; --bid-7: #9085e9; --bid-8: #e66767;
  --text: #f2f2f2; --muted: #b4b4b4; --primary: #ffffff; --primary-ink: #0a0a0a; --data: #5cc0a8; --data-soft: #15302a; --chart-2: #8f8f8f; --grid: #2b2b2b;
  --positive: #3fc07a; --negative: #e5566f; --warning: #e2b05a;
  --pill-positive-bg: #172a1d; --pill-positive-ink: #3fc07a; --pill-negative-bg: #2c1a20; --pill-negative-ink: #e5566f;
  --pill-warning-bg: #2a2214; --pill-warning-ink: #e2b05a; --notice-border: #4a3a1a; --pill-neutral-bg: #262626; --pill-neutral-ink: #d0d0d0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #0b0b0b; --surface: #141414; --raised: #1c1c1c; --active: #262626; --border: #262626; --rule: #1f1f1f; --control: #3d3d3d;
  --bid-1: #3987e5; --bid-2: #d95926; --bid-3: #199e70; --bid-4: #c98500; --bid-5: #d55181; --bid-6: #008300; --bid-7: #9085e9; --bid-8: #e66767;
  --text: #f2f2f2; --muted: #b4b4b4; --primary: #ffffff; --primary-ink: #0a0a0a; --data: #5cc0a8; --data-soft: #15302a; --chart-2: #8f8f8f; --grid: #2b2b2b;
  --positive: #3fc07a; --negative: #e5566f; --warning: #e2b05a;
  --pill-positive-bg: #172a1d; --pill-positive-ink: #3fc07a; --pill-negative-bg: #2c1a20; --pill-negative-ink: #e5566f;
  --pill-warning-bg: #2a2214; --pill-warning-ink: #e2b05a; --notice-border: #4a3a1a; --pill-neutral-bg: #262626; --pill-neutral-ink: #d0d0d0;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--text); font-family: var(--f-body); font-size: var(--fs-body); line-height: 20px; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.wrap { max-width: calc(1152px + 2 * max(16px, env(safe-area-inset-left, 0px))); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); border-bottom: 1px solid var(--border); }
.topbar { display: flex; align-items: center; gap: 28px; height: 56px; }
.topbar .save-state { margin-left: auto; white-space: nowrap; }
.brand-name { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand-name svg { flex: none; }
.brand-name span { color: var(--muted); font-weight: 500; }
.save-state { font-size: var(--fs-small); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.save-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--chart-2); display: inline-block; }
.save-state.ok i { background: var(--positive); }
nav.tabs { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; font: 500 15px var(--f-body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 0; margin-bottom: -1px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
nav.tabs .count { font-size: 12px; font-weight: 600; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--raised); color: var(--text); display: inline-flex; align-items: center; justify-content: center; }
nav.tabs .count:empty { display: none; }
nav.subtabs { display: flex; gap: 4px; margin: -8px 0 24px; overflow-x: auto; scrollbar-width: none; }
nav.subtabs button { flex: none; font: 500 13px var(--f-body); color: var(--muted); background: none; border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
nav.subtabs button:hover { color: var(--text); background: var(--raised); }
nav.subtabs button[aria-current="true"] { color: var(--text); background: var(--surface); border-color: var(--border); }
@media (max-width: 560px) { .topbar { gap: 14px; } .topbar .brand-name { font-size: 0; gap: 0; } .topbar .save-state span { display: none; } nav.tabs { gap: 16px; } nav.tabs button { font-size: 14px; } }
nav.tabs button:hover { color: var(--text); }
nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }

main { padding-block: 32px 64px; }
.lead { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
.lead h1 { font-size: var(--fs-title); line-height: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lead p { margin: 0; color: var(--muted); font-size: 15px; line-height: 22px; max-width: 72ch; }
.lead p strong { color: var(--text); font-weight: 500; }
.bench { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: var(--gap); align-items: start; }
.bench.rev { grid-template-columns: minmax(0, 1fr) minmax(0, 340px); }
@media (max-width: 900px) { .bench, .bench.rev { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; min-width: 0; }
.panel h3 { font-size: var(--fs-section); line-height: 22px; margin: 0 0 12px; font-weight: 500; }
.stack { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.eyebrow { font-size: 13px; line-height: 18px; color: var(--muted); font-weight: 500; }

.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding-block: 8px; border-bottom: 1px solid var(--rule); }
.field:last-child { border-bottom: 0; }
.field label { font-size: 14px; }
.field small { grid-column: 1 / -1; color: var(--muted); font-size: var(--fs-small); line-height: 16px; }
.num { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-control); padding: 0 8px; height: 32px; }
.num input, .num input[type="text"] { border: 0; border-radius: 0; background: transparent; min-width: 0; width: 7.5em; border: 0; background: transparent; color: var(--text); font: 500 14px var(--f-body); font-variant-numeric: tabular-nums; text-align: right; padding: 0 2px; height: 30px; }
.num input:focus { outline: none; }
.num input[data-custom] { color: var(--data); }
.field .slider { grid-column: 1 / -1; width: 100%; height: 20px; margin: 2px 0 0; background: none; -webkit-appearance: none; appearance: none; cursor: pointer; }
.slider::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--active); }
.slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--active); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
.slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
.slider:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
@media (min-width: 901px) { #out-money, #out-bid, #out-value { position: sticky; top: 112px; } }
.num:focus-within { border-color: var(--text); }
.num span { color: var(--muted); font-size: var(--fs-small); padding-left: 4px; }
input[type="text"], input[type="url"], select { font: 14px var(--f-body); color: var(--text); background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-control); height: 32px; padding: 0 8px; min-width: 0; }
select { cursor: pointer; }
.seg { display: inline-flex; background: var(--raised); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 1px solid transparent; background: none; font: 500 13px var(--f-body); color: var(--muted); height: 28px; padding: 0 10px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--border); }

.btn { font: 500 14px var(--f-body); border-radius: var(--r-control); height: var(--control-height); padding: 0 14px; border: 1px solid var(--control); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background-color .12s, transform .08s; }
.btn:hover { background: var(--raised); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover { opacity: .88; background: var(--primary); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding: 0 8px; height: 28px; }
.btn.ghost:hover { color: var(--negative); background: none; }

.mono, .money { font-variant-numeric: tabular-nums; }
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.bigfig { font-weight: 700; font-size: 34px; line-height: 40px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }
.bigfig small { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.kv .total { border-top: 1px solid var(--rule); padding-top: 8px; font-weight: 500; color: var(--text); }
.kv dd.total { font-weight: 700; }
/* KPI strip: one container split by 1px dividers, label over value */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.tile { background: var(--surface); border: 0; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; min-width: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: background-color .12s; }
.tile:hover { background: var(--raised); }
.tile .v { font-weight: 500; font-size: 22px; line-height: 28px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.tile .s { font-size: var(--fs-small); line-height: 16px; color: var(--muted); }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; height: 20px; padding: 0 8px; border-radius: 999px; white-space: nowrap; flex: none; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); }
.chip.good { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.chip.warn { background: var(--pill-warning-bg); color: var(--pill-warning-ink); }
.chip.bad { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
.chip.ex, .chip.info { background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); }

.limits { display: flex; flex-direction: column; gap: 12px; }
.limit { display: grid; grid-template-columns: 10em 1fr 5.5em; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.limit .mono { text-align: right; color: var(--text); }
.bar { height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--chart-2); border-radius: 4px; }
.limit.binding { color: var(--text); font-weight: 500; }
.limit.binding .bar b { background: var(--data); }
@media (max-width: 480px) { .limit { grid-template-columns: 1fr auto; } .limit .bar { grid-column: 1 / -1; grid-row: 2; } }

.note { font-size: 13px; line-height: 19px; color: var(--muted); background: var(--raised); border-radius: 8px; padding: 10px 12px; }
.note strong { color: var(--text); font-weight: 500; }
.banner-ex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--pill-warning-bg); border: 1px solid var(--notice-border); color: var(--pill-warning-ink); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: var(--gap); }
.banner-ex .chip { display: none; }
.banner-ex button { margin-left: auto; height: 30px; }

.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 0 16px; height: 44px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { height: 38px; font-size: 12px; color: var(--muted); font-weight: 400; background: none; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
thead th[aria-sort] { color: var(--text); font-weight: 500; }
thead th[aria-sort]::after { content: " ↑"; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--raised); }
tr.best td:nth-child(2) { color: var(--data); font-weight: 700; }
td a { color: var(--text); text-decoration: none; font-weight: 500; }
td a:hover { text-decoration: underline; }
.dim { color: var(--muted); }

.apts { display: flex; flex-direction: column; gap: var(--gap); }
.apt { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 16px; }
@media (max-width: 760px) { .apt { grid-template-columns: minmax(0, 1fr); } }
.apt-photo { grid-column: 1 / -1; display: block; aspect-ratio: 16 / 6; border-radius: 6px; overflow: hidden; background: var(--raised); margin: -4px -4px 0; }
.apt-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.apt-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; grid-column: 1 / -1; }
.apt-head input[type="text"] { flex: 1 1 220px; font-weight: 500; font-size: 15px; height: 36px; }
.apt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--gap); }
.apt-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.apt-grid .num, .apt-grid .num input { width: 100%; }
.apt-out { background: var(--raised); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.apt-out .chips { display: flex; gap: 6px; flex-wrap: wrap; }

.rooms { columns: 2 440px; column-gap: var(--gap); }
.rooms > .room { break-inside: avoid; margin-bottom: var(--gap); }
.room h4 { margin: 0 0 4px; display: flex; justify-content: space-between; font-size: 15px; font-weight: 500; }
.room h4 span { font-weight: 500; color: var(--muted); font-size: 14px; }
.item { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; min-height: 44px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.item:last-child { border-bottom: 0; }
.item.have .nm { text-decoration: line-through; color: var(--muted); }
.item .num input { width: 5.2em; }
.item .ess { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--text); cursor: pointer; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ol.steps.two { display: block; columns: 2 400px; column-gap: 48px; }
ol.steps.two > .step { break-inside: avoid; }
.step { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.steps:not(.two) .step:last-child { border-bottom: 0; }
.step .n { display: none; }
.step h4 { margin: 0; font-size: 15px; font-weight: 500; }
.step p { margin: 2px 0 0; color: var(--muted); font-size: 14px; max-width: 72ch; }
.step.done h4 { color: var(--muted); text-decoration: line-through; }
.progress { height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden; }
.progress b { display: block; height: 100%; background: var(--data); border-radius: 4px; }
.row { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
a { color: var(--text); text-underline-offset: 2px; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.evid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 20px; }
.evid > div { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.evid p { margin: 0; font-size: 14px; }
.evid a { font-size: 12px; color: var(--muted); }
svg text { font-family: var(--f-body); }
@media (prefers-reduced-motion: no-preference) { .bar b, .progress b { transition: width .35s ease; } }
/* Map */
.map-panel { padding: 0; overflow: hidden; margin: 8px 0 4px; }
#map { height: 380px; background: var(--raised); }
.map-panel .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 16px; font-size: 12px; border-top: 1px solid var(--border); }
.map-panel .legend span { display: inline-flex; align-items: center; gap: 6px; }
.map-panel .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.leaflet-container { font: 13px var(--f-body); }
.leaflet-popup-content a { color: var(--data); }
.leaflet-container { background: var(--raised); }
.leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.leaflet-bar a { background: var(--surface); color: var(--text); border-color: var(--border); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--surface); color: var(--text); box-shadow: 0 2px 10px rgb(0 0 0 / .18); }
@media (max-width: 640px) { #map { height: 300px; } }
/* Showings */
.show input[type="text"]:not([data-num]), .show input[type="url"], .show select { font: 400 13px var(--f-body); height: 32px; border: 1px solid var(--control); border-radius: var(--r-control); background: var(--surface); color: var(--text); padding: 0 8px; min-width: 0; }

const LS_KEY = "sthlm-bostadsplan-v1";
let docRef = null, saveTimer = null, saving = false, pending = false;

async function flush() {

    try {

      if (!r.ok) throw new Error(r.status);
      setSaveState("Sparat på den här datorn", true);
    } catch (e) { setSaveState(local ? "Sparat bara i webbläsaren, servern svarar inte" : "Inte sparat", local); }
    return;
  }
  if (!docRef) { setSaveState(local ? "Sparat i webbläsaren" : "Inte sparat (lagring blockerad)", local); return; }
  if (saving) { pending = true; return; }
  saving = true;
  try { await docRef.set({ plan: JSON.stringify(S), savedAt: new Date().toISOString() }); setSaveState("Sparat på ditt konto", true); }
  catch (e) { setSaveState(local ? "Sparat i webbläsaren" : "Inte sparat", local); }

}
async function initStore() {
  const local = lsRead();

  setSaveState(local ? "Sparat i webbläsaren" : "Exempelplan", !!local);
  if (LOCAL) {
    try {
      const r = await fetch("/api/plan", { cache: "no-store" });
      if (r.ok) { S = merge(DEFAULT(), await r.json()); migrate(); render(); }
      await flush(); // moves a browser-only plan to the server and gives the scraper this plan's areas and budget
    } catch (e) { setSaveState("Den lokala servern svarar inte, sparar i webbläsaren", !!local); }

  }
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    docRef = db.collection("data/users/" + id).doc("plan");
    const snap = await Promise.race([docRef.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    if (snap.exists) {

      try { S = merge(DEFAULT(), JSON.parse(d.plan)); migrate(); render(); } catch (e) {}

    } else {

  const step = gross <= 20000 ? 100 : gross <= 80000 ? 200 : 1;               // the table's income intervals

  if (!S.example) return `<div class="ex-slot"></div>`;
  return `<div class="ex-slot"><div class="banner-ex"><span class="chip ex">Exempel</span><span>${text}</span><button class="btn" data-act="clear-example">Börja med mina egna siffror</button></div></div>`;
}

const VIEWS = {
  overview() {
    const a = affordability(), cr = chosenRate();
    const target = +S.fin.targetPrice || 0;
    const mc = monthlyCost(target, S.fin.targetAvgift, cr.rate);
    const furn = furnitureTotal();
    const needCash = target * 0.10 + closingFees() + furn.total + (+S.fin.buffer || 0);
    const gap = needCash - (+S.fin.savings || 0);
    const months = gap > 0 && S.fin.monthlySave > 0 ? Math.ceil(gap / S.fin.monthlySave) : 0;
    const doneSteps = STEPS.filter((s) => S.steps[s[0]]).length;
    const maxShown = a.max;
    const searchTo = Math.floor(maxShown * (1 - S.search.headroom / 100) / 50000) * 50000;
    return `
      <div class="lead"><h1>Översikt</h1>
      <p>${({ cash: "Dina kontanter", offer: "Ditt lånelöfte", income: "Din inkomst", kalp: "Bankens KALP" })[a.binding.key]} sätter gränsen: du kan troligen bjuda upp till <strong>${mkr(a.max)}</strong>, och en lägenhet för ${mkr(target)} kostar <strong>${kr(mc.total)}</strong> i månaden.</p></div>
      ${exampleBanner("Det här är exempelsiffror så att du ser hur planen fungerar. Byt ut dem mot dina egna.")}
      <div class="hero">
        <section class="panel">
          <span class="eyebrow">Högsta pris du troligen kan bjuda</span>
          <div class="bigfig" data-out="max">${kr(maxShown).replace(" kr", "")}<small> kr</small></div>
          <p class="dim" style="margin:6px 0 16px">Begränsas av <strong style="color:var(--ink)">${a.binding.label.toLowerCase()}</strong>. ${esc(a.binding.hint)}</p>
          <div class="limits">${a.limits.map((l) => `
            <div class="limit ${l === a.binding ? "binding" : ""}"><span>${l.label}</span><div class="bar"><b style="width:${Math.min(100, (a.max / Math.max(l.value, 1)) * 100).toFixed(1)}%"></b></div><span class="mono">${l.value > 25e6 ? "25+ Mkr" : mkr(l.value)}</span></div>`).join("")}
          </div>
          <p class="note" style="margin:16px 0 0">Den kortaste stapeln bestämmer ditt max. Det är banken som avgör på riktigt i ditt <strong>lånelöfte</strong>, så se det här som en uppskattning att planera efter.</p>
        </section>
        <section class="panel">
          <span class="eyebrow">Målet</span>
          <div class="row" style="margin:6px 0 10px">${numField("fin.targetPrice", "Pris du siktar på", "kr", "", "50000")}</div>
          <dl class="kv">
            <dt>Kontantinsats (10 %)</dt><dd>${kr(target * 0.10)}</dd>
            <dt>Avgifter till föreningen</dt><dd>${kr(closingFees())}</dd>
            <dt>Möbler och flytt</dt><dd>${kr(furn.total)}</dd>
            <dt>Buffert du behåller</dt><dd>${kr(S.fin.buffer)}</dd>
            <dt class="total">Kontanter som behövs</dt><dd class="total">${kr(needCash)}</dd>
            <dt>Ditt sparande</dt><dd>${kr(S.fin.savings)}</dd>
            <dt class="total">${gap > 0 ? "Kvar att spara" : "Över målet med"}</dt><dd class="total" style="color:${gap > 0 ? "var(--warn)" : "var(--good)"}">${kr(Math.abs(gap))}</dd>
          </dl>
          <p class="dim" style="margin:10px 0 0;font-size:.86rem">${gap > 0 ? (months ? `Med ${kr(S.fin.monthlySave)} i månaden är du där om ungefär <strong style="color:var(--ink)">${months} månader</strong>.` : "Fyll i hur mycket du sparar i månaden under Privatekonomi, så ser du när du är där.") : "Du har kontanterna för det här målet."} ${target > a.max ? `<span class="chip bad">Över ditt max</span>` : `<span class="chip good">Inom ditt max</span>`}</p>
        </section>
      </div>
      <div class="tiles" style="margin-top:20px">
        <button class="tile" data-goto="rates"><span class="eyebrow">Månadskostnad för målet</span><span class="v">${kr(mc.total)}</span><span class="s">Efter ränteavdrag, med ${pct(cr.rate)} (${esc(cr.label)})</span></button>
        <button class="tile" data-goto="rates"><span class="eyebrow">Bästa listränta 3 mån</span><span class="v">${pct(bestRate("m3"))}</span><span class="s">${esc(BANKS.find((b) => b.r.m3 === bestRate("m3")).name)}, uppdaterad ${RATES_UPDATED}</span></button>
        <button class="tile" data-goto="five"><span class="eyebrow">Tightaste månaden på 5 år</span><span class="v">${kr(Math.min(...Object.values(S.five.scen).flatMap((sc) => projectFive(sc).map((r) => r.left))))}</span><span class="s">Kvar i det sämsta scenariot</span></button>
        <button class="tile" data-goto="show"><span class="eyebrow">Visningar söker upp till</span><span class="v">${mkr(+S.show.f.maxPrice || searchTo)}</span><span class="s">${apartments().length} lägenheter hittade, ${S.apts.length} sparade</span></button>
        <button class="tile" data-goto="furnish"><span class="eyebrow">Möbelbudget</span><span class="v">${kr(furn.total)}</span><span class="s">${furn.count} saker att köpa, ${TIERS.find((t) => t[0] === S.furn.tier)[1].toLowerCase()}</span></button>
        <button class="tile" data-goto="steps"><span class="eyebrow">Steg i köpet</span><span class="v">${doneSteps} / ${STEPS.length}</span><span class="s">${doneSteps < STEPS.length ? "Nästa: " + esc(STEPS.find((s) => !S.steps[s[0]])[1]) : "Allt klart. Välkommen hem."}</span></button>
      </div>`;
  },

  money() {
    const f = S.fin, two = f.buyers === 2;
    return `
      <div class="lead"><h1>Privatekonomi</h1>
      <p>Banken tittar på tre saker: dina kontanter till kontantinsatsen, din inkomst mot alla skulder, och en kvar att leva på-kalkyl (KALP) av din månadsbudget med högre ränta.</p></div>
      ${exampleBanner("Exempel på ekonomi. Fyll i din egen lön och ditt sparande.")}
      <div class="bench">
        <div class="stack">
          <section class="panel"><h3>Inkomst</h3>
            <div class="field"><label>Köper</label><div class="seg">
              <button data-set="fin.buyers" data-val="1" aria-pressed="${!two}">Ensam</button>
              <button data-set="fin.buyers" data-val="2" aria-pressed="${two}">Tillsammans</button></div></div>
            ${numField("fin.gross1", two ? "Din bruttolön / mån" : "Bruttolön / mån", "kr", "Före skatt.")}
            ${f.netAuto ? "" : numField("fin.net1", two ? "Din nettolön / mån" : "Nettolön / mån", "kr", "Det som kommer in på kontot.")}
            ${two ? numField("fin.gross2", "Partnerns bruttolön / mån") + (f.netAuto ? "" : numField("fin.net2", "Partnerns nettolön / mån")) : ""}
            <div id="out-net">${VIEWS.netOut()}</div>
            <div class="field"><label for="f-netauto">Räkna ut nettolönen från bruttolönen</label><input id="f-netauto" type="checkbox" data-check="fin.netAuto" ${f.netAuto ? "checked" : ""}></div>
            ${f.netAuto ? `<div class="field"><label for="f-church">Medlem i Svenska kyrkan</label><input id="f-church" type="checkbox" data-check="fin.church" ${f.church ? "checked" : ""}><small>Lägger till kyrkoavgift, ungefär 1 % i Stockholm.</small></div>` : ""}
          </section>
          <section class="panel"><h3>Sparande och skulder</h3>
            ${numField("fin.savings", "Sparande att använda", "kr", "Kontanter, ISK och fonder du säljer till köpet.", "10000")}
            ${numField("fin.buffer", "Buffert att behålla", "kr", "Pengar för oförutsett som inte går till lägenheten.", "5000")}
            ${numField("fin.monthlySave", "Du sparar varje månad", "kr", "", "500")}
            ${numField("fin.otherDebt", "Andra skulder (CSN, bil, lån)", "kr", "", "10000")}
            ${numField("fin.otherDebtMonthly", "Månadsbetalning på de skulderna", "kr", "", "100")}
            <div class="field"><label for="f-resf">Avsätt möbelbudgeten från sparandet</label><input id="f-resf" type="checkbox" data-check="fin.reserveFurniture" ${f.reserveFurniture ? "checked" : ""}></div>
          </section>
          <section class="panel"><h3>Bankens kalkyl</h3>
            ${numField("fin.living", "Levnadskostnader / mån", "kr", "Mat, resor, kläder, telefon. Bankerna räknar med schablonbelopp på ungefär 8–10 000 kr per vuxen" + (two ? ", alltså runt 18 000 kr för två." : "."), "500")}
            ${numField("fin.targetAvgift", "Väntad avgift", "kr/mån", "Månadsavgiften till föreningen.", "100")}
            ${numField("fin.stress", "Kalkylränta", "%", "Bankerna räknar med högre ränta än du betalar, oftast 6–7 %.", "0.5")}
            ${numField("fin.incomeMult", "Största lån, gånger årsinkomsten", "×", "Många banker stannar runt 5,5×; vissa lånar ut 6× eller mer.", "0.25")}
            <div class="field"><label for="f-kded">Räkna med ränteavdrag i KALP</label><input id="f-kded" type="checkbox" data-check="fin.kalpDeduction" ${f.kalpDeduction ? "checked" : ""}><small>Bankerna gör olika. Av är det strängare.</small></div>
          </section>
          <section class="panel"><h3>Bankens besked</h3>
            ${numField("fin.bankOffer", "En bank har lovat att låna ut", "kr", "Fyll i beloppet i ditt lånelöfte. Det ersätter uppskattningarna från inkomst och KALP. Lämna tomt för att använda uppskattningarna.", "50000")}
          </section>
        </div>
        <div class="stack" id="out-money">${VIEWS.moneyOut()}</div>
      </div>`;
  },
  netOut() {
    const f = S.fin, two = f.buyers === 2;
    if (!f.netAuto) return "";
    const row = (label, g) => `<dt>${label}</dt><dd>${kr(netOf(g))}</dd>`;
    return `<div class="field" style="display:block"><dl class="kv">
      ${row(two ? "Din nettolön / mån" : "Nettolön / mån", f.gross1)}
      ${two ? row("Partnerns nettolön / mån", f.gross2) : ""}
      <dt>Skatt / mån</dt><dd>${kr(monthlyTax(+f.gross1 || 0, f.church) + (two ? monthlyTax(+f.gross2 || 0, f.church) : 0))}</dd>
    </dl><small style="display:block;margin-top:6px">Från Skatteverkets skattetabell 2026 för Stockholm (${String(TAX.kommun).replace(".", ",")} % plus begravningsavgift), med grundavdrag och jobbskatteavdrag.</small></div>`;
  },
  moneyOut() {
    const a = affordability(), h = household(), f = S.fin, cr = chosenRate();
    const loanAtMax = Math.max(0, a.max - a.cash);
    const mc = monthlyCost(a.max, f.targetAvgift, cr.rate);
    const surplus = kalpSurplus(loanAtMax, a.max);
    return `
      <section class="panel">
        <span class="eyebrow">Ditt maxpris</span>
        <div class="bigfig">${kr(a.max).replace(" kr", "")}<small> kr</small></div>
        <p class="dim" style="margin:4px 0 14px">Sätts av <strong style="color:var(--ink)">${a.binding.label.toLowerCase()}</strong>.</p>
        <div class="limits">${a.limits.map((l) => `
          <div class="limit ${l === a.binding ? "binding" : ""}"><span>${l.label}</span><div class="bar"><b style="width:${Math.min(100, (a.max / Math.max(l.value, 1)) * 100).toFixed(1)}%"></b></div><span class="mono">${l.value > 25e6 ? "25+ Mkr" : mkr(l.value)}</span></div>`).join("")}</div>
      </section>
      <section class="panel"><h3>Så går pengarna ihop vid ditt max</h3>
        <dl class="kv">
          <dt>Sparande</dt><dd>${kr(f.savings)}</dd>
          <dt>− Buffert</dt><dd>${kr(-f.buffer)}</dd>
          <dt>− Avgifter till föreningen (överlåtelse + pantsättning)</dt><dd>${kr(-closingFees())}</dd>
          ${f.reserveFurniture ? `<dt>− Möbler och flytt</dt><dd>${kr(-furnitureTotal().total)}</dd>` : ""}
          <dt class="total">Kontanter till kontantinsats</dt><dd class="total">${kr(a.cash)}</dd>
          <dt>Bolån</dt><dd>${kr(loanAtMax)}</dd>
          <dt>Belåningsgrad</dt><dd>${pct(a.max ? loanAtMax / a.max * 100 : 0, 1)}</dd>
          <dt>Skuldkvot</dt><dd>${h.gross ? ((loanAtMax + (+f.otherDebt || 0)) / (h.gross * 12)).toFixed(1).replace(".", ",") + "×" : "–"}</dd>
        </dl>
      </section>
      <section class="panel"><h3>Månadskostnad vid ditt max</h3>
        <dl class="kv">
          <dt>Ränta ${pct(cr.rate)} efter 30 % ränteavdrag</dt><dd>${kr(mc.interestNet)}</dd>
          <dt>Amortering (${(amortRate(mc.ltv) * 100).toFixed(0)} % per år)</dt><dd>${kr(mc.amort)}</dd>
          <dt>Avgift</dt><dd>${kr(mc.avgift)}</dd>
          <dt>El, försäkring, bredband</dt><dd>${kr(mc.running)}</dd>
          <dt class="total">Totalt per månad</dt><dd class="total">${kr(mc.total)}</dd>
          <dt>Kvar efter boende och levnadskostnader</dt><dd style="color:${h.net - mc.total - f.living - f.otherDebtMonthly < 0 ? "var(--bad)" : "var(--good)"}">${kr(h.net - mc.total - f.living - f.otherDebtMonthly)}</dd>
          <dt>Marginal i KALP med ${f.stress} %</dt><dd>${kr(surplus)}</dd>
        </dl>
        <p class="note" style="margin:14px 0 0">Regler som används: <strong>bolånetak 90 %</strong> (10 % kontant) och amortering på 2 % över 70 % belåningsgrad och 1 % mellan 50 och 70 %, som gäller sedan 1 april 2026. Ränteavdraget är 30 % av räntan upp till 100 000 kr om året och 21 % över det. Bankernas egna gränser varierar.</p>
      </section>`;
  },

  rates() {
    const r = S.rates, cr = chosenRate();
    const a = affordability();
    const price = +S.fin.targetPrice || a.max;
    const mc = monthlyCost(price, S.fin.targetAvgift, cr.rate);
    const loan = mc.loan;
    const rows = BANKS.map((b) => ({ ...b, rate: b.r[r.binding] })).filter((b) => b.rate != null);
    rows.sort((x, y) => r.sort === "snitt" ? (x.snitt ?? 99) - (y.snitt ?? 99) : r.sort === "name" ? x.name.localeCompare(y.name, "sv") : x.rate - y.rate);
    const best = Math.min(...rows.map((b) => b.rate));
    return `
      <div class="lead"><h1>Bolåneräntor</h1>
      <p>Listräntan är utgångspriset. Snitträntan är vad kunderna faktiskt betalade förra månaden, och den visar hur mycket utrymme det finns att förhandla.</p></div>
      <div class="row" style="margin-bottom:14px">
        <span class="eyebrow">Bindningstid</span>
        <div class="seg">${BINDINGS.map(([k, l]) => `<button data-set="rates.binding" data-val="${k}" aria-pressed="${r.binding === k}">${l}</button>`).join("")}</div>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th data-sort="name" ${r.sort === "name" ? 'aria-sort="ascending"' : ""}>Bank</th>
            <th data-sort="rate" ${r.sort === "rate" ? 'aria-sort="ascending"' : ""}>Listränta</th>
            <th data-sort="snitt" ${r.sort === "snitt" ? 'aria-sort="ascending"' : ""}>Snittränta 3 mån</th>
            <th>Ränta / mån</th>
            <th>Efter ränteavdrag</th>
          </tr></thead>
          <tbody>${rows.map((b) => `
            <tr class="${b.rate === best ? "best" : ""}">
              <td><a href="${b.url}" target="_blank" rel="noopener">${esc(b.name)}</a>${b.note ? ` <span class="dim" style="font-size:.78rem">· ${esc(b.note)}</span>` : ""}</td>
              <td class="mono">${pct(b.rate)}</td>
              <td class="mono ${b.snitt == null ? "dim" : ""}">${b.snitt == null ? "–" : pct(b.snitt)}</td>
              <td class="mono">${kr(loan * b.rate / 100 / 12)}</td>
              <td class="mono">${kr(interestAfterDeduction(loan * b.rate / 100) / 12)}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <p class="dim" style="font-size:.8rem;margin:8px 0 20px">Räntor från <a href="${RATES_SOURCE}" target="_blank" rel="noopener">lanupplysningen.se</a>, uppdaterade ${RATES_UPDATED}. Räntan visas för ett lån på ${kr(loan)} (ditt målpris minus dina kontanter). Kolla varje banks egen sida innan du bestämmer dig. Specialbanker (Bluestep, Marginalen, Nordax, Svea) är inte med.</p>
      <div class="bench">
        <section class="panel"><h3>Räntan i din plan</h3>
          <div class="seg" style="margin-bottom:10px">
            <button data-set="rates.mode" data-val="list" aria-pressed="${r.mode === "list"}">Bästa listränta</button>
            <button data-set="rates.mode" data-val="snitt" aria-pressed="${r.mode === "snitt"}">Snittränta</button>
            <button data-set="rates.mode" data-val="offer" aria-pressed="${r.mode === "offer"}">Mitt erbjudande</button>
          </div>
          ${r.mode === "offer" ? numField("rates.offer", "Räntan en bank har erbjudit dig", "%", "", "0.01") : ""}
          <p class="dim" style="font-size:.86rem;margin:8px 0 12px">Räknar med <strong style="color:var(--ink)">${pct(cr.rate)}</strong>, ${esc(cr.label)}.</p>
          <dl class="kv">
            <dt>Lån vid ${mkr(price)}</dt><dd>${kr(mc.loan)}</dd>
            <dt>Ränta efter ränteavdrag</dt><dd>${kr(mc.interestNet)}</dd>
            <dt>Amortering</dt><dd>${kr(mc.amort)}</dd>
            <dt class="total">Bolån per månad</dt><dd class="total">${kr(mc.interestNet + mc.amort)}</dd>
          </dl>
        </section>
        <section class="panel"><h3>Så kommer du under listräntan</h3>
          <ul style="margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.9rem">
            <li>Skaffa lånelöften från två eller tre banker och be sedan din favorit slå det bästa skriftligt.</li>
            <li>Storbankernas snitträntor ligger ungefär 1–1,3 procentenheter under listräntorna. Ditt första erbjudande bör ligga nära det.</li>
            <li>Lägre belåningsgrad ger oftast bättre ränta. Vissa banker har räntetrappor vid 60 % och 50 %.</li>
            <li>Rörlig ränta (3 mån) har varit billigast. Bunden ränta ger en fast kostnad, men du kan inte byta bank gratis under bindningstiden.</li>
            <li>Lönekonto, försäkringar och sparande i samma bank är vanliga förhandlingskort.</li>
          </ul>
        </section>
      </div>`;
  },

  five() {
    const F = S.five, cr = chosenRate();
    const cell = (k, y) => `<td><span class="num">${numInput(`aria-label="${esc(F.scen[k].name)} år ${y + 1}" data-five="${k}" data-y="${y}"`, F.scen[k].dr[y], "4.2em")}<span>pp</span></span></td>`;
    return `
      <div class="lead"><h1>Budget på 5 år</h1>
      <p>Utgår från din lön, din mållägenhet och dagens ränta i planen, ${pct(cr.rate)}. Allt är i dagens penningvärde: lönen och vardagskostnaderna antas följa inflationen, så det är bara bolåneräntan och avgiften som ändras.</p></div>
      ${exampleBanner("Bygger på exempelekonomin. Fyll i din egen lön under Privatekonomi.")}
      <div class="bench">
        <div class="stack">
          <section class="panel"><h3>Dina antaganden</h3>
            ${S.fin.netAuto ? numField("fin.gross1", S.fin.buyers === 2 ? "Din bruttolön / mån" : "Bruttolön / mån", "kr", "Netto efter skatt: " + kr(household().net) + " i månaden" + (S.fin.buyers === 2 ? " för er båda" : "") + ".", "500") : numField("fin.net1", S.fin.buyers === 2 ? "Din nettolön / mån" : "Nettolön / mån", "kr", "Ändra bruttolön och partnerns lön under Privatekonomi.", "500")}
            ${numField("fin.living", "Levnadskostnader / mån", "kr", "", "500")}
            ${numField("fin.targetPrice", "Lägenhetens pris", "kr", "", "50000")}
            ${numField("fin.targetAvgift", "Avgift i dag", "kr/mån", "", "100")}
            ${numField("five.avgiftExtra", "Avgiften stiger mer än lönen med", "% / år", "Föreningar för vidare sina egna lånekostnader, så avgifterna har ofta stigit snabbare än lönerna.", "0.25")}
          </section>
          <section class="panel"><h3>Lägenhetens värde</h3>
            <p class="dim" style="margin:-4px 0 8px;font-size:.86rem">${S.value.mode === "manual" ? `Fast ökning på ${pct(+S.value.manual, 1)} per år.` : `Trend från priserna i ${esc(regress(S.value.area, +S.value.win).A.name)}: <strong style="color:var(--ink)">${pct(valueGrowth() * 100, 1)}</strong> per år.`}</p>
            <button class="btn" data-goto="value">Byt område eller metod</button>
          </section>
        </div>
        <div class="stack" id="out-five">${VIEWS.fiveOut()}</div>
      </div>
      <div id="out-five-table" style="margin-top:var(--gap)">${VIEWS.fiveTable()}</div>
      <section class="panel" style="margin-top:20px"><h3>Ändra räntescenarierna</h3>
        <p class="dim" style="margin:-6px 0 12px;font-size:.85rem">Ändring i procentenheter jämfört med dagens ${pct(cr.rate)}. Chockraden bygger på 2022–23, då tremånadersräntan steg ungefär 3 procentenheter på ett år.</p>
        <div class="tablewrap"><table>
          <thead><tr><th>Scenario</th>${[1, 2, 3, 4, 5].map((y) => `<th>År ${y}</th>`).join("")}</tr></thead>
          <tbody>${Object.keys(F.scen).map((k, i) => `
            <tr><td><span class="sw" style="background:${k === F.pick ? "var(--data)" : "var(--chart-2)"}"></span>${esc(F.scen[k].name)}</td>${[0, 1, 2, 3, 4].map((y) => cell(k, y)).join("")}</tr>`).join("")}
          </tbody></table></div>
      </section>`;
  },
  fiveOut() {
    const F = S.five, keys = Object.keys(F.scen);
    const all = keys.map((k) => projectFive(F.scen[k]));
    const pick = keys.includes(F.pick) ? F.pick : keys[0];
    const P = all[keys.indexOf(pick)];
    const W = 640, H = 240, L = 64, R = 120, T = 16, B = 30;
    const vals = all.flat().map((r) => r.left);
    let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
    const span = hi - lo || 1000, stepRaw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= stepRaw);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const x = (i) => L + (i * (W - L - R)) / 4, yv = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);
    const ticks = []; for (let v = lo; v <= hi + 1e-6; v += step) ticks.push(v);
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pengar kvar varje månad per scenario" style="width:100%;height:auto;display:block">
      ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${yv(v)}" y2="${yv(v)}" stroke="${v === 0 ? "var(--muted)" : "var(--line)"}" stroke-width="${v === 0 ? 1.5 : 1}"/><text x="${L - 8}" y="${yv(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${nf.format(v)}</text>`).join("")}
      ${[0, 1, 2, 3, 4].map((i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">År ${i + 1}</text>`).join("")}
      ${all.map((rows, si) => { const on = keys[si] === pick; const c = on ? "var(--data)" : "var(--chart-2)"; return `<polyline fill="none" stroke="${c}" stroke-width="${on ? 2.5 : 1.5}" points="${rows.map((r, i) => `${x(i)},${yv(r.left)}`).join(" ")}"/>${on ? rows.map((r, i) => `<circle cx="${x(i)}" cy="${yv(r.left)}" r="3.5" fill="${c}"/>`).join("") : ""}`; }).join("")}
      ${(() => { const ls = all.map((rows, si) => ({ y: yv(rows[4].left), name: F.scen[keys[si]].name, on: keys[si] === pick })).sort((a, b) => a.y - b.y); for (let i = 1; i < ls.length; i++) ls[i].y = Math.max(ls[i].y, ls[i - 1].y + 14); return ls.map((l) => `<text x="${x(4) + 10}" y="${l.y + 4}" font-size="12" fill="${l.on ? "var(--text)" : "var(--muted)"}" font-weight="${l.on ? 500 : 400}">${esc(l.name)}</text>`).join(""); })()}
    </svg>`;
    const sum = all.map((rows, i) => ({ k: keys[i], min: Math.min(...rows.map((r) => r.left)), end: rows[4] }));
    return `
      <section class="panel">
        <span class="eyebrow">Pengar kvar varje månad efter alla kostnader</span>
        <div class="seg" style="margin:8px 0 10px">${keys.map((k, i) => `<button data-set="five.pick" data-val="${k}" aria-pressed="${k === pick}"><span class="sw" style="background:${k === pick ? "var(--data)" : "var(--chart-2)"}"></span>${esc(F.scen[k].name)}</button>`).join("")}</div>
        <div style="overflow-x:auto">${svg}</div>
        <div class="tiles" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${sum.map((w, i) => `
          <div class="tile" style="cursor:default"><span class="eyebrow"><span class="sw" style="background:${w.k === pick ? "var(--data)" : "var(--chart-2)"}"></span>${esc(F.scen[w.k].name)}</span>
          <span class="v" style="font-size:1.1rem;color:${w.min < 0 ? "var(--bad)" : w.min < 3000 ? "var(--warn)" : "var(--ink)"}">${kr(w.min)}</span><span class="s">den tightaste månaden; ${kr(w.end.saved)} sparat till år 5</span></div>`).join("")}</div>
      </section>
      `;
  },
  fiveTable() {
    const F = S.five, keys = Object.keys(F.scen), pick = keys.includes(F.pick) ? F.pick : keys[0];
    const P = projectFive(F.scen[pick]);
    return `
      <section class="panel"><h3>${esc(F.scen[pick].name)}, år för år</h3>
        <div class="tablewrap"><table>
          <thead><tr><th>År</th><th>Ränta</th><th>Ränta*/mån</th><th>Amortering/mån</th><th>Avgift/mån</th><th>Kvar/mån</th><th>Lån</th><th>Lägenhetens värde</th><th>Eget kapital</th></tr></thead>
          <tbody>${P.map((r) => `<tr><td>År ${r.y}</td><td class="mono">${pct(r.rate)}</td><td class="mono">${kr(r.interestNet)}</td><td class="mono">${kr(r.amort)}</td><td class="mono">${kr(r.avgift)}</td><td class="mono" style="font-weight:600;color:${r.left < 0 ? "var(--bad)" : "var(--ink)"}">${kr(r.left)}</td><td class="mono">${kr(r.loan)}</td><td class="mono">${kr(r.value)}</td><td class="mono">${kr(r.equity)}</td></tr>`).join("")}</tbody>

        <p class="dim" style="font-size:.8rem;margin:8px 0 0">*Efter ränteavdrag. Antar att varje krona som blir över sparas. ${S.value.mode === "manual" ? "" : `År 5 är trendens 95 %-intervall för lägenhetens värde ${kr(P[4].valueLo)} till ${kr(P[4].valueHi)}.`} Historiska priser är i nominella kronor, så i dagens penningvärde är värdeökningen ungefär 2 procentenheter lägre.</p>
      </section>`;
  },

  value() {
    const V = S.value;
    return `
      <div class="lead"><h1>Områdespriser</h1>
      <p>Bara områden innanför tullarna. Genomsnittligt pris per kvm för bostadsrätter per år, från <a href="${PRICE_SOURCE}" target="_blank" rel="noopener">Svensk Mäklarstatistik</a> (till 2025). En log-linjär regression ger den genomsnittliga årliga ökningen under perioden du väljer och ett 95 %-intervall för de kommande fem åren. En trend beskriver det som har varit: priserna i Stockholm föll ungefär 10 % 2017–18 och igen 2022–23.</p></div>
      <div class="bench">
        <div class="stack"><section class="panel"><h3>Område och metod</h3>
          <div class="field"><label for="f-varea">Område</label><select id="f-varea" data-path="value.area">${Object.entries(AREAS).map(([k, a]) => `<option value="${k}" ${V.area === k ? "selected" : ""}>${esc(a.name)}</option>`).join("")}</select></div>
          <div class="field"><label>År i regressionen</label><div class="seg">${[[0, "Alla"], [15, "15"], [10, "10"], [5, "5"]].map(([w, l]) => `<button data-set="value.win" data-val="${w}" aria-pressed="${+V.win === w}">${l}</button>`).join("")}</div>
          <small>Äldre år innehåller uppgången 2005–2017. De senaste åren speglar dagens högre räntor.</small></div>
          <div class="field"><label>Ökning i din femårsbudget</label><div class="seg">
            <button data-set="value.mode" data-val="regression" aria-pressed="${V.mode !== "manual"}">Regression</button>
            <button data-set="value.mode" data-val="manual" aria-pressed="${V.mode === "manual"}">Fast</button></div></div>
          ${V.mode === "manual" ? numField("value.manual", "Fast ökning", "% / år", "", "0.5") : ""}
        </section>
        <div id="out-growth">${VIEWS.growthOut()}</div></div>
        <div class="stack" id="out-value">${VIEWS.valueOut()}</div>
      </div>`;
  },
  growthOut() {
    const V = S.value;
    const wins = [[0, "Alla år"], [15, "15 år"], [10, "10 år"], [5, "5 år"]].map(([w, l]) => ({ w, l, r: regress(V.area, w) }));
    return `      <section class="panel"><h3>Ökningen beror på vilken period du tittar på</h3>
        <dl class="kv">${wins.map((o) => `<dt>${o.l} (${o.r.pts[0][0]}–${o.r.pts.at(-1)[0]})</dt><dd>${pct(o.r.g * 100, 1)} / år</dd>`).join("")}</dl>

      </section>`;
  },
  valueOut() {
    const V = S.value, R = regress(V.area, +V.win), A = R.A;
    const allPts = A.v.map((v, i) => [A.from + i, v]);
    const x0 = A.from, x1 = BUY_YEAR + 5;
    const proj = []; for (let yr = BUY_YEAR - 1; yr <= x1; yr++) proj.push([yr, R.pred(yr)]);
    const ymax = Math.max(...allPts.map((p) => p[1]), ...proj.map((p) => p[1].hi));
    const W = 660, H = 280, L = 62, Rr = 16, T = 14, B = 28;
    const stepRaw = ymax / 5, mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= stepRaw), top = Math.ceil(ymax / step) * step;
    const x = (yr) => L + ((yr - x0) / (x1 - x0)) * (W - L - Rr), y = (v) => T + (1 - v / top) * (H - T - B);
    const ticks = []; for (let v = 0; v <= top + 1e-6; v += step) ticks.push(v);
    const xt = []; for (let yr = Math.ceil(x0 / 5) * 5; yr <= x1; yr += 5) xt.push(yr);
    const fitFrom = R.pts[0][0], fit = []; for (let yr = fitFrom; yr <= BUY_YEAR - 1; yr++) fit.push([yr, R.pred(yr).mid]);
    const band = proj.map(([yr, p]) => `${x(yr)},${y(p.hi)}`).join(" ") + " " + proj.slice().reverse().map(([yr, p]) => `${x(yr)},${y(p.lo)}`).join(" ");
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pris per kvm över tid och trend för ${esc(A.name)}" style="width:100%;height:auto;display:block">
      ${ticks.map((v) => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v ? nf.format(v / 1000) + "k" : "0"}</text>`).join("")}
      ${xt.map((yr) => `<text x="${x(yr)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${yr}</text>`).join("")}
      <rect x="${x(fitFrom) - 4}" y="${T}" width="${x(BUY_YEAR - 1) - x(fitFrom) + 8}" height="${H - T - B}" fill="var(--accent-soft)" opacity=".5"/>
      <polygon points="${band}" fill="var(--accent)" opacity=".15"/>
      <polyline fill="none" stroke="var(--muted)" stroke-width="1.5" points="${allPts.map(([yr, v]) => `${x(yr)},${y(v)}`).join(" ")}"/>
      ${allPts.map(([yr, v]) => `<circle cx="${x(yr)}" cy="${y(v)}" r="3" fill="${yr >= fitFrom ? "var(--ink)" : "var(--muted)"}"><title>${yr}: ${nf.format(v)} kr/kvm</title></circle>`).join("")}
      <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${fit.map(([yr, v]) => `${x(yr)},${y(v)}`).join(" ")}"/>
      <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 5" points="${proj.map(([yr, p]) => `${x(yr)},${y(p.mid)}`).join(" ")}"/>
      <circle cx="${x(x1)}" cy="${y(proj.at(-1)[1].mid)}" r="4.5" fill="var(--accent)"/>
    </svg>`;
    const price = +S.fin.targetPrice || 0;
    const v5 = valueAt(price, 5), pR = R.pred(x1);
    return `
      <section class="panel">
        <div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="eyebrow">${esc(A.name)} · kr/kvm</span><span class="dim" style="font-size:.78rem">Prickar: verkliga priser · linje: anpassad trend · streckad: prognos med 95 %-intervall</span></div>
        <div style="overflow-x:auto">${svg}</div>
      </section>
      <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
        <div class="tile" style="cursor:default"><span class="eyebrow">Trendökning</span><span class="v">${pct(R.g * 100, 1)}</span><span class="s">per år, ${R.pts[0][0]}–${R.pts.at(-1)[0]} · R² ${R.r2.toFixed(2).replace(".", ",")}</span></div>
        <div class="tile" style="cursor:default"><span class="eyebrow">Senaste 3 månaderna</span><span class="v">${nf.format(A.now)}</span><span class="s">kr/kvm, till 8 okt 2026</span></div>
        <div class="tile" style="cursor:default"><span class="eyebrow">Området ${x1}</span><span class="v">${nf.format(pR.mid)}</span><span class="s">kr/kvm, intervall ${nf.format(pR.lo)}–${nf.format(pR.hi)}</span></div>
        <div class="tile" style="cursor:default"><span class="eyebrow">Din lägenhet för ${mkr(price)} år ${x1}</span><span class="v">${mkr(v5.mid)}</span><span class="s">intervall ${mkr(v5.lo)}–${mkr(v5.hi)}</span></div>
      </div>
`;
  },

  bid() {
    const B = S.bid;
    return `
      <div class="lead"><h1>Budgivning</h1>
      <p>Forskningen om svenska och norska budgivningar ger ett blandat svar. Ett stort hoppbud kan skrämma bort konkurrenter och ge dig lägenheten, men budgivningar med hoppbud brukar också sluta på ett högre pris. Den större risken är psykologisk: att ryckas med och bjuda mer än du har råd med.</p></div>
      <div class="bench">
        <div class="stack">
          <section class="panel"><h3>Din budplan</h3>
            ${numField("bid.ask", "Utgångspris", "kr", "", "25000")}
            ${numField("bid.walk", "Ditt maxbud", "kr", "Det mesta du betalar. Bestäm det innan budgivningen börjar och ändra det inte under tiden.", "25000")}
            ${numField("bid.step", "Vanlig höjning", "kr", "Mäklare i Stockholm brukar vänta sig minst 10 000–25 000 kr per bud.", "5000")}
            ${numField("fin.targetAvgift", "Avgift", "kr/mån", "", "100")}
            <div class="row" style="margin-top:10px"><button class="btn" data-act="walk-max">Sätt maxbudet till mitt maxpris</button></div>
          </section>
          <section class="panel"><h3>Innan du lägger första budet</h3>
            <ul style="margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.9rem">
              <li>Skriv ner ditt maxbud och berätta det för någon som håller dig till det.</li>
              <li>Kolla vad liknande lägenheter i föreningen och i närheten faktiskt såldes för (slutpriser). Strunta i utgångspriset: det sätts ofta lågt för att locka budgivare.</li>
              <li>Fråga mäklaren hur budgivningen går till: tidsgränser, om de tar emot bud före visningen och när säljaren bestämmer sig.</li>
              <li>Ha lånelöftet klart och kolla att det räcker till ditt maxbud.</li>
              <li>Läs föreningens årsredovisning innan du bjuder, inte efter att du har vunnit.</li>
              <li>Bestäm i förväg vem som svarar på mäklarens sms om ni köper tillsammans. Två personer som bjuder från två telefoner är hur planer spricker.</li>
              <li>Fråga hur länge varje runda är öppen. En tidsgräns är mäklarens sätt att sätta press; du kan ändå ta tio minuter innan du svarar.</li>
            </ul>
          </section>
        </div>
        <div class="stack" id="out-bid">${VIEWS.bidOut()}</div>
      </div>
      <section class="panel" style="margin-top:20px"><h3>Vad forskningen säger</h3>
        <div class="evid">
          <div><span class="chip warn">Lägenheter i Stockholm</span><p><strong>Stora hopp minskar konkurrensen</strong>, men större genomsnittliga budhöjningar hänger ihop med högre slutpris. Ett lågt utgångspris lockade inte fler budgivare och höjde inte priset. 629 försäljningar i innerstaden 2010–11.</p><a href="https://www.emerald.com/jerer/article-abstract/11/2/202/215521/An-analysis-of-auction-strategies-in-apartment" target="_blank" rel="noopener">Hungria-Gunnelin, Journal of European Real Estate Research, 2018 ↗</a></div>
          <div><span class="chip warn">Norge</span><p>Budgivningar med hoppbud slutade <strong>ungefär 2,8–9,3 % högre</strong> än budgivningar med bara små steg. Budgivarna sa att de hoppar för att skrämma och signalera, och vissa konkurrenter hoppade av för att de kände sig skrämda. Underlag: 1 142 budlistor och en enkät med 1 803 budgivare.</p><a href="https://ntnuopen.ntnu.no/ntnu-xmlui/handle/11250/2675844" target="_blank" rel="noopener">Khazal, Sønstebø, Olaussen &amp; Oust, Journal of Property Research, 2020 ↗</a></div>
          <div><span class="chip info">Svenska villor</span><p>Ett hoppbud under budgivningen höjde både priset och <strong>hoppbudgivarens chans att vinna</strong>, men avslutade sällan budgivningen.</p><a href="https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4517555" target="_blank" rel="noopener">Gunnelin, Hungria-Gunnelin, MacGregor &amp; Wersing, SSRN working paper ↗</a></div>
          <div><span class="chip bad">Psykologi</span><p><strong>Budgivningsfeber</strong>: rivalitet, tidspress och att andra tittar på får folk att bjuda mer än de tänkt. Det beskriver en budgivning i Stockholm, med sms som kommer ett efter ett fram till en tidsgräns.</p><span class="dim" style="font-size:.82rem">Ku, Malhotra &amp; Murnighan, Organizational Behavior and Human Decision Processes 96, 2005</span></div>
        </div>
        <p class="note" style="margin:14px 0 0"><strong>Reglerna:</strong> i Sverige är ett bud inte bindande för någon. Först ett skriftligt kontrakt som båda parter skrivit under gör köpet bindande (bostadsrättslagen 6 kap. 4 §). Du kan dra dig ur, och säljaren kan välja vilken budgivare som helst eller avbryta försäljningen. Mäklaren måste föra en budlista och lämna den till köpare och säljare, så be om den. Läs <a href="https://seb.se/privat/bolan/bostadsguide/budgivning-och-kontrakt" target="_blank" rel="noopener">SEB:s guide om budgivning och kontrakt</a> och <a href="https://www.hemnet.se/guider/dolt-bud" target="_blank" rel="noopener">Hemnet om dolda bud</a>.</p>
      </section>`;
  },
  bidOut() {
    const B = S.bid, cr = chosenRate();
    const ask = +B.ask || 0, walk = +B.walk || affordability().max, step = Math.max(1000, +B.step || 25000);
    const base = monthlyCost(ask, S.fin.targetAvgift, cr.rate);
    const over = walk - ask;
    const steps = [25000, 50000, 100000, 250000].map((d) => {
      const m = monthlyCost(ask + d, S.fin.targetAvgift, cr.rate);
      return { d, month: m.total - base.total, cash: d * 0.10, five: (m.interestNet - base.interestNet) * 60 };
    });
    // Suggested plan: open near asking, small steps through the middle, one firm jump to around 90 % of the walk-away price, then stop at the walk-away price
    const jumpTo = Math.floor((ask + over * 0.9) / 5000) * 5000;
    const plan = over <= 0 ? [] : [
      ["Öppning", "Bjud utgångspriset eller strax över, om budgivningen inte har börjat.", ask],
      ["Mitten", `Höj med ungefär ${kr(step)} i taget. Svara inte inom sekunder: att vänta några minuter före varje bud hindrar dig från att agera på impuls och visar inte hur ivrig du är.`, Math.min(walk, ask + step * 4)],
      ["Sent hopp (om du vill)", "Om bara en eller två konkurrenter är kvar kan ett bestämt hopp visa att du tänker gå längre. Forskningen tyder på att det kan hjälpa dig att vinna, men det höjer priset.", Math.max(ask, jumpTo)],
      ["Maxbud", "Stanna här. Ett bud är inte bindande, så säljaren kan fortfarande höra av sig till dig om vinnaren hoppar av.", walk],
    ];
    return `
      <section class="panel">
        <span class="eyebrow">Utrymme mellan utgångspris och maxbud</span>
        <div class="bigfig" style="color:${over < 0 ? "var(--bad)" : "var(--ink)"}">${over >= 0 ? "+" : ""}${kr(over).replace(" kr", "")}<small> kr</small></div>
        <p class="dim" style="margin:4px 0 0">${ask ? pct(over / ask * 100, 1) + " över utgångspriset. " : ""}${over < 0 ? "Utgångspriset är redan över ditt maxbud. Hoppa över den här, eller vänta och se om den inte blir såld." : `Månadskostnad vid ditt maxbud: <strong style="color:var(--ink)">${kr(monthlyCost(walk, S.fin.targetAvgift, cr.rate).total)}</strong>.`}</p>
      </section>
      ${plan.length ? `<section class="panel"><h3>Ett förslag på budplan</h3>
        <ol class="steps">${plan.map(([t, d, v], i) => `<li class="step"><div><h4>${t}</h4><p>${d}</p></div><span class="mono" style="font-weight:700;white-space:nowrap">${kr(v)}</span></li>`).join("")}</ol>
      </section>` : ""}
      <section class="panel"><h3>Vad varje extra bud faktiskt kostar</h3>
        <p class="dim" style="margin:-6px 0 10px;font-size:.86rem">Under budgivningen kan 50 000 kr kännas som ett litet steg. Så här mycket lägger det till med räntan i din plan, ${pct(cr.rate)}.</p>
        <div class="tablewrap"><table>
          <thead><tr><th>Bjud mer med</th><th>Per månad</th><th>Ränta på 5 år</th><th>Mer kontant vid kontrakt</th></tr></thead>
          <tbody>${steps.map((r) => `<tr><td class="mono">+${kr(r.d)}</td><td class="mono">+${kr(r.month)}</td><td class="mono">+${kr(r.five)}</td><td class="mono">+${kr(r.cash)}</td></tr>`).join("")}</tbody>
        </table></div>
        <p class="dim" style="font-size:.8rem;margin:8px 0 0">Månadskostnaden räknar med ränta efter ränteavdrag och amortering. Femårskolumnen räknar bara räntan, eftersom amorteringen går tillbaka till ditt eget kapital.</p>
      </section>`;
  },

  search() {
    const s = S.search, a = affordability();
    const searchTo = Math.floor(a.max * (1 - s.headroom / 100) / 50000) * 50000;
    const using = +S.show.f.maxPrice === searchTo;
    return `
      <div class="lead"><h1>Sparade lägenheter</h1>
      <p>Vad varje lägenhet kostar i månaden, hur frisk föreningen ser ut och, när budgivningen börjar, hur den går bud för bud. Spara en från Visningar med hjärtat, eller lägg till den här med en länk till mäklarens sida.</p></div>
      <div class="bench rev">
        <div>
          <div class="row" style="margin:0 0 12px"><span class="dim" style="font-size:13px">${S.apts.length} sparade</span><span class="spacer"></span><button class="btn" data-act="add-apt">Lägg till lägenhet</button></div>
          <div class="apts">${S.apts.length ? S.apts.map(aptCard).join("") : `<div class="panel dim">Inget sparat än. Tryck på hjärtat på en visning för att följa den här.</div>`}</div>
        </div>
        <div class="stack">
          <section class="panel"><h3>Hur högt du ska söka</h3>
            ${numField("search.headroom", "Utrymme för bud över utgångspriset", "%", "Lägenheter i Stockholm säljs ofta över utgångspriset, så sök under ditt max.", "1")}

// How the bidding has gone: each bid as a step over time, coloured by bidder, against the asking price and your max.
// From the agent's own bid list where it shows one, else from the highest bid the finder read each day.
const mn = (v) => (v / 1e6).toFixed(2).replace(".", ",") + " mn";
const fmtWhen = (s) => new Date(s).toLocaleString("sv-SE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function bidChart(p, f) {
  // Oldest first; bids in the same minute, lower first
  let pts = (f.bidList || []).slice().sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : a.amount - b.amount)).map((b) => ({ t: +new Date(b.at), at: b.at, v: b.amount, who: b.who }));
  const daily = pts.length < 2;
  if (daily) pts = (f.history || []).filter((h) => h.bid).map((h) => ({ t: +new Date(h.at), at: h.at, v: h.bid, who: null }));
  if (pts.length < 2) return "";
  const ask = +p.price || +((LIST.items[p.link] || {}).price) || 0, max = affordability().max;
  const order = [...new Set(pts.map((x) => x.who).filter(Boolean))]; // bidders in the order they first bid
  const slot = (who) => { const i = order.indexOf(who); return i < 0 ? 0 : i < 8 ? i + 1 : 0; };
  const W = 760, H = 230, L = 52, R = 104, T = 16, B = 28, n = pts.length;
  let lo = Math.min(...pts.map((x) => x.v), ask || Infinity), hi = Math.max(...pts.map((x) => x.v));
  const showMax = max > 0 && max <= hi * 1.15 && max >= lo * 0.9;
  if (showMax) { lo = Math.min(lo, max); hi = Math.max(hi, max); }
  const pad = (hi - lo) * 0.1 || 50000; lo -= pad; hi += pad;
  // One even step per bid: bidding comes in bursts (twenty bids in an evening, then one two days later), so time would bunch them
  const x = (i) => L + (i / (n - 1)) * (W - L - R), y = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);
  const step = 10 ** Math.floor(Math.log10((hi - lo) / 3)), tick = [1, 2, 2.5, 5, 10].map((m) => m * step).find((s) => (hi - lo) / s <= 4);
  const ticks = []; for (let v = Math.ceil(lo / tick) * tick; v <= hi; v += tick) ticks.push(v);
  const path = pts.map((q, i) => (i ? `H${x(i).toFixed(1)}V${y(q.v).toFixed(1)}` : `M${x(i).toFixed(1)} ${y(q.v).toFixed(1)}`)).join("");
  const ref = (v, label, cls) => `<g class="ref ${cls}"><line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${W - R + 6}" y="${y(v) + 4}">${label} ${mn(v)}</text></g>`;
  const last = pts[pts.length - 1], first = pts[0];
  // A date under the first bid of each day, skipping any that would crowd the one before
  let lastX = -99;
  const days = pts.map((q, i) => {
    if (i && q.at.slice(0, 10) === pts[i - 1].at.slice(0, 10)) return "";
    const line = i ? `<line class="day" x1="${x(i - 0.5)}" x2="${x(i - 0.5)}" y1="${T}" y2="${H - B}"/>` : "";
    if (x(i) - lastX < 48) return line;
    lastX = x(i);
    return `${line}<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="${i ? "middle" : "start"}">${new Date(q.t).toLocaleDateString("sv-SE", { day: "numeric", month: "short" })}</text>`;
  }).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bud från ${mn(first.v)} till ${mn(last.v)} kr">
    ${ticks.map((v) => `<g><line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${mn(v)}</text></g>`).join("")}
    ${ask ? ref(ask, "Utgångspris", "ask") : ""}${showMax ? ref(max, "Ditt max", "max") : ""}
    <path class="steps" d="${path}"/>
    ${pts.map((q, i) => `<g class="pt"><circle class="hit" cx="${x(i)}" cy="${y(q.v)}" r="11"/><circle class="dot b${daily ? 0 : slot(q.who)}" cx="${x(i)}" cy="${y(q.v)}" r="4.5"/><title>${kr(q.v)}${q.who ? ", budgivare " + q.who : ""}, ${daily ? fmtShort(q.at) : fmtWhen(q.at)}</title></g>`).join("")}
    <text class="lastv" x="${x(n - 1)}" y="${y(last.v) - 10}" text-anchor="end">${mn(last.v)}</text>
    ${days}
  </svg>`;
  const over = ask ? last.v - ask : 0;
  const bidders = order.length;
  const facts = [daily ? `Högsta bud under ${pts.length} dagar` : `${pts.length} bud${bidders ? ` från ${bidders} budgivare` : ""}`,
    ask ? `${over >= 0 ? "+" : ""}${kr(over)} (${over >= 0 ? "+" : ""}${Math.round((over / ask) * 100)} %) mot utgångspriset` : "",
    daily ? `senast ${fmtShort(last.at)}` : `senast ${fmtWhen(last.at)}${last.who ? " av budgivare " + last.who : ""}`,
    showMax ? (last.v > max ? `<strong>${kr(last.v - max)} över ditt max</strong>` : `${kr(max - last.v)} kvar till ditt max`) : ""].filter(Boolean);
  const legend = !daily && bidders > 1 ? `<div class="bid-legend">${order.slice(0, 8).map((w) => `<span><i class="b${slot(w)}"></i>Budgivare ${esc(w)}</span>`).join("")}${bidders > 8 ? `<span><i class="b0"></i>Övriga</span>` : ""}</div>` : "";
  const rows = pts.slice().reverse();
  const table = `<details class="bid-table"><summary>${daily ? "Varje dag" : "Alla bud"}</summary><table><thead><tr><th>${daily ? "Dag" : "Tid"}</th>${daily ? "" : "<th>Budgivare</th>"}<th>Bud</th><th>Höjning</th></tr></thead><tbody>${rows.map((q, i) => {
      const prev = rows[i + 1];
      return `<tr><td>${daily ? fmtShort(q.at) : fmtWhen(q.at)}</td>${daily ? "" : `<td>${esc(q.who || "–")}</td>`}<td>${kr(q.v)}</td><td>${prev ? (q.v - prev.v >= 0 ? "+" : "") + kr(q.v - prev.v) : ""}</td></tr>`;
    }).join("")}</tbody></table></details>`;
  return `<div class="bidchart"><p class="bid-facts">${facts.join(" · ")}</p>${svg}${legend}${table}</div>`;
}

// Update live outputs without rebuilding inputs (keeps focus while typing)
// Update the page in place: only what changed is touched, and the field being edited is left alone
function morph(from, to) {
  if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) { from.replaceWith(to.cloneNode(true)); return; }
  if (from.nodeType === 3 || from.nodeType === 8) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
  if (from === document.activeElement && (from.tagName === "INPUT" || from.tagName === "SELECT")) return;
  if (from.id === "map") return; // the map draws itself
  if (from.tagName === "DETAILS" && from.open && from.dataset.fill) return; // an opened gallery or description stays as it is
  for (const a of [...from.attributes]) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
  for (const a of [...to.attributes]) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  if (from.tagName === "INPUT") {
    if (from.type === "checkbox") from.checked = to.hasAttribute("checked");
    else if (from.value !== (to.getAttribute("value") ?? "")) from.value = to.getAttribute("value") ?? "";
    return;
  }
  morphChildren(from, to);
  if (from.tagName === "SELECT") from.value = to.value;
}
function morphChildren(from, to) {
  const f = [...from.childNodes], t = [...to.childNodes];
  t.forEach((node, i) => (f[i] ? morph(f[i], node) : from.appendChild(node.cloneNode(true))));
  for (let i = t.length; i < f.length; i++) f[i].remove();
}

function migrateShow() {
  const sh = S.show;

    if (sh.ratings[id]) { sh.ratings[name] = { ...sh.ratings[id], ...(sh.ratings[name] || {}) }; delete sh.ratings[id]; }
  }
  for (const v of Object.values(sh.visits)) if (LEGACY_AREAS[v.hood]) { v.area = LEGACY_AREAS[v.hood]; delete v.hood; }
  if (!sh.f) {

      maxAvgift: +q.get("maxRent") || null, notGround: q.get("floor") === "aboveBottomFloor", includeSoon: true };
  }

const pad2 = (n) => String(n).padStart(2, "0");
const isoLocal = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

// Same test as the finder's, so the planner and the finder agree on what fits
function fits(p, f = S.show.f) {
  if (p.outside || p.state === "sold") return false;
  if (p.soon && !f.includeSoon) return false;
  if (f.maxPrice && p.price && p.price > f.maxPrice) return false;
  if (f.minRooms && p.rooms && p.rooms < f.minRooms) return false;
  if (f.minArea && p.kvm && p.kvm < f.minArea) return false;
  if (f.maxAvgift && p.avgift && p.avgift > f.maxAvgift) return false;
  if (f.notGround && (p.floor === "BV" || p.floor === "0")) return false;
  return true;
}
function apartments() { return Object.values(LIST.items).filter((p) => fits(p)); }

/* ---------- The finder's status ---------- */
const CRAWL = { state: "idle", msg: "", scheduled: null };
const NO_SERVER = "Den lokala servern svarar inte. Starta den med: .venv/bin/python server.py";
let pollTimer = null;
function setCrawl(state, msg) {
  CRAWL.state = state; CRAWL.msg = msg;
  const b = document.querySelector('#tabs button[data-sec="show"]'); if (b) b.classList.toggle("busy", state === "running");
  if (S.tab === "show") refresh();
}
async function pollStatus() {
  if (!LOCAL) return;
  clearTimeout(pollTimer);
  try {
    const st = await (await fetch("/api/status", { cache: "no-store" })).json();
    const was = CRAWL.state;
    if ((was === "running" && !st.running) || (st.running && Date.now() - (pollStatus.loaded || 0) > 30000)) {
      pollStatus.loaded = Date.now();
      await loadList();
      loadTravel();
    }
    CRAWL.scheduled = !!st.scheduled;
    setCrawl(st.running ? "running" : st.state || "idle", st.msg || "");
    if (st.running) pollTimer = setTimeout(pollStatus, 5000);
  } catch (e) { setCrawl("error", NO_SERVER); }
}
async function startScrape() {
  await flush(); // so the run uses the filter on screen
  const r = await fetch("/api/scrape", { method: "POST" }).catch(() => null);
  if (!r) return setCrawl("error", NO_SERVER);
  setCrawl("running", r.status === 409 ? "Körs redan" : "Startar…");
  pollTimer = setTimeout(pollStatus, 2000);
}

function showWindow(mode, now) {
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (mode === "week") {
    const mon = new Date(today); mon.setDate(today.getDate() + ((8 - today.getDay()) % 7 || 7));
    const end = new Date(mon); end.setDate(mon.getDate() + 7);
    return [isoLocal(mon), isoLocal(end)];
  }
  const end = new Date(today); end.setDate(today.getDate() + (mode === "all" ? 60 : 8));
  return [isoLocal(now), isoLocal(end)];
}
function showingsIn(p, from, to) {

  if (p.floor) bits[0] += p.floor === "BV" ? " på bottenvåningen" : ` på våning ${String(p.floor).replace(".", ",")}`;
  const f = (p.extra || []).slice(0, 6).map((x) => FEATURE_SV[x] || x); // at most six, so the sentence stays readable
  if (f.length) bits[0] += " med " + (f.length > 1 ? f.slice(0, -1).join(", ") + " och " + f[f.length - 1] : f[0]);

function flagChips(flags, saved = false) {
  const order = { bad: 0, warn: 1, ask: 2, good: 3 };
  const fs = flags.filter((f) => saved || f.kind !== "ask").sort((a, b) => order[a.kind] - order[b.kind]);
  let goods = 0;
  return fs.filter((f) => f.kind !== "good" || saved || ++goods <= 3)
    .map((f) => `<span class="chip ${f.kind === "ask" ? "info" : f.kind}" title="${esc(f.quote)}">${f.kind === "bad" ? "⚠ " : f.kind === "ask" ? "? " : ""}${esc(f.label)}</span>`);
}
