<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Stockholm Bostadsplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap">
<style>
/* Achromatic ledger: no colour in the chrome; verdigris (Gamla stan's copper roofs) is the one data hue.
   Shell: 48px top bar + underline tabs over a centred 1152px column. Grid: one 12px gap everywhere;
   bench = 380 + 12 + 760 = 1152; hero = 1.3fr/1fr of 1140 after the gap. */
:root {
  --ground: #f2f4f3;      /* granite-grey ground, one level off white */
  --surface: #ffffff;
  --raised: #eef0ef;
  --active: #e6e9e8;
  --border: #e3e6e5;
  --rule: #edf0ef;
  --control: #d2d6d5;
  --text: #0a0a0a;
  --muted: #5d6462;
  --primary: #141414;
  --primary-ink: #ffffff;
  --data: #1f6b5a;        /* verdigris, the one chart hue */
  --data-soft: #e2eeea;
  --chart-2: #8a8f8d;
  --grid: #e5e7e6;
  --positive: #2e7d32;
  --negative: #c4242a;
  --warning: #92400e;
  --pill-positive-bg: #dcfae5; --pill-positive-ink: #04250e;
  --pill-negative-bg: #ffedea; --pill-negative-ink: #831c1e;
  --pill-warning-bg: #fffbeb; --pill-warning-ink: #92400e; --notice-border: #fde68a;
  --pill-neutral-bg: #eeeeee; --pill-neutral-ink: #3d3d3d;
  /* names used by the page's markup */
  --ink: var(--text); --line: var(--border); --sunk: var(--raised); --accent: var(--data); --accent-soft: var(--data-soft);
  --good: var(--positive); --warn: var(--warning); --bad: var(--negative);
  --s1: var(--chart-2); --s2: var(--chart-2); --s3: var(--chart-2); --s4: var(--chart-2);
  --f-body: "Geist", Inter, system-ui, sans-serif;
  --f-display: var(--f-body);
  --f-mono: var(--f-body);
  --r: 8px; --r-control: 6px;
  --gap: 12px; --pad: 24px; --control-height: 36px;
  --fs-title: 24px; --fs-section: 16px; --fs-kpi: 30px; --fs-body: 14px; --fs-small: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0b0b0b; --surface: #141414; --raised: #1c1c1c; --active: #262626; --border: #262626; --rule: #1f1f1f; --control: #3d3d3d;
  --text: #f2f2f2; --muted: #b4b4b4; --primary: #ffffff; --primary-ink: #0a0a0a; --data: #5cc0a8; --data-soft: #15302a; --chart-2: #8f8f8f; --grid: #2b2b2b;
  --positive: #3fc07a; --negative: #e5566f; --warning: #e2b05a;
  --pill-positive-bg: #172a1d; --pill-positive-ink: #3fc07a; --pill-negative-bg: #2c1a20; --pill-negative-ink: #e5566f;
  --pill-warning-bg: #2a2214; --pill-warning-ink: #e2b05a; --notice-border: #4a3a1a; --pill-neutral-bg: #262626; --pill-neutral-ink: #d0d0d0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground: #0b0b0b; --surface: #141414; --raised: #1c1c1c; --active: #262626; --border: #262626; --rule: #1f1f1f; --control: #3d3d3d;
  --text: #f2f2f2; --muted: #b4b4b4; --primary: #ffffff; --primary-ink: #0a0a0a; --data: #5cc0a8; --data-soft: #15302a; --chart-2: #8f8f8f; --grid: #2b2b2b;
  --positive: #3fc07a; --negative: #e5566f; --warning: #e2b05a;
  --pill-positive-bg: #172a1d; --pill-positive-ink: #3fc07a; --pill-negative-bg: #2c1a20; --pill-negative-ink: #e5566f;
  --pill-warning-bg: #2a2214; --pill-warning-ink: #e2b05a; --notice-border: #4a3a1a; --pill-neutral-bg: #262626; --pill-neutral-ink: #d0d0d0;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--text); font-family: var(--f-body); font-size: var(--fs-body); line-height: 20px; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.wrap { max-width: calc(1152px + 2 * max(16px, env(safe-area-inset-left, 0px))); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; }
.brand-name { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand-name svg { flex: none; }
.brand-name span { color: var(--muted); font-weight: 500; }
.save-state { font-size: var(--fs-small); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.save-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--chart-2); display: inline-block; }
.save-state.ok i { background: var(--positive); }
nav.tabs { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { flex: none; font: 500 14px var(--f-body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0 10px; margin-bottom: -1px; cursor: pointer; }
nav.tabs button:hover { color: var(--text); }
nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }

main { padding-block: 32px 64px; }
.lead { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
.lead h1 { font-size: var(--fs-title); line-height: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lead p { margin: 0; color: var(--muted); font-size: 15px; line-height: 22px; max-width: 72ch; }
.lead p strong { color: var(--text); font-weight: 500; }
.bench { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: var(--gap); align-items: start; }
@media (max-width: 900px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; min-width: 0; }
.panel h3 { font-size: var(--fs-section); line-height: 22px; margin: 0 0 12px; font-weight: 500; }
.stack { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.eyebrow { font-size: 13px; line-height: 18px; color: var(--muted); font-weight: 500; }

.field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding-block: 8px; border-bottom: 1px solid var(--rule); }
.field:last-child { border-bottom: 0; }
.field label { font-size: 14px; }
.field small { grid-column: 1 / -1; color: var(--muted); font-size: var(--fs-small); line-height: 16px; }
.num { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-control); padding: 0 8px; height: 32px; }
.num input, .num input[type="text"] { border: 0; border-radius: 0; background: transparent; min-width: 0; width: 7.5em; border: 0; background: transparent; color: var(--text); font: 500 14px var(--f-body); font-variant-numeric: tabular-nums; text-align: right; padding: 0 2px; height: 30px; }
.num input:focus { outline: none; }
.num input[data-custom] { color: var(--data); }
.field .slider { grid-column: 1 / -1; width: 100%; height: 20px; margin: 2px 0 0; background: none; -webkit-appearance: none; appearance: none; cursor: pointer; }
.slider::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--active); }
.slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--active); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
.slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--text); }
.slider:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }
@media (min-width: 901px) { #out-money, #out-bid, #out-value { position: sticky; top: 112px; } }
.num:focus-within { border-color: var(--text); }
.num span { color: var(--muted); font-size: var(--fs-small); padding-left: 4px; }
input[type="text"], input[type="url"], select { font: 14px var(--f-body); color: var(--text); background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-control); height: 32px; padding: 0 8px; min-width: 0; }
select { cursor: pointer; }
.seg { display: inline-flex; background: var(--raised); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 1px solid transparent; background: none; font: 500 13px var(--f-body); color: var(--muted); height: 28px; padding: 0 10px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); border-color: var(--border); }

.btn { font: 500 14px var(--f-body); border-radius: var(--r-control); height: var(--control-height); padding: 0 14px; border: 1px solid var(--control); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background-color .12s, transform .08s; }
.btn:hover { background: var(--raised); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover { opacity: .88; background: var(--primary); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding: 0 8px; height: 28px; }
.btn.ghost:hover { color: var(--negative); background: none; }

.mono, .money { font-variant-numeric: tabular-nums; }
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--gap); align-items: start; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.bigfig { font-weight: 700; font-size: 34px; line-height: 40px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 4px; }
.bigfig small { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.kv .total { border-top: 1px solid var(--rule); padding-top: 8px; font-weight: 500; color: var(--text); }
.kv dd.total { font-weight: 700; }
/* KPI strip: one container split by 1px dividers, label over value */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.tile { background: var(--surface); border: 0; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; min-width: 0; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: background-color .12s; }
.tile:hover { background: var(--raised); }
.tile .v { font-weight: 500; font-size: 22px; line-height: 28px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.tile .s { font-size: var(--fs-small); line-height: 16px; color: var(--muted); }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; height: 20px; padding: 0 8px; border-radius: 999px; white-space: nowrap; flex: none; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); }
.chip.good { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.chip.warn { background: var(--pill-warning-bg); color: var(--pill-warning-ink); }
.chip.bad { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }
.chip.ex, .chip.info { background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); }

.limits { display: flex; flex-direction: column; gap: 12px; }
.limit { display: grid; grid-template-columns: 10em 1fr 5.5em; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.limit .mono { text-align: right; color: var(--text); }
.bar { height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--chart-2); border-radius: 4px; }
.limit.binding { color: var(--text); font-weight: 500; }
.limit.binding .bar b { background: var(--data); }
@media (max-width: 480px) { .limit { grid-template-columns: 1fr auto; } .limit .bar { grid-column: 1 / -1; grid-row: 2; } }

.note { font-size: 13px; line-height: 19px; color: var(--muted); background: var(--raised); border-radius: 8px; padding: 10px 12px; }
.note strong { color: var(--text); font-weight: 500; }
.banner-ex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--pill-warning-bg); border: 1px solid var(--notice-border); color: var(--pill-warning-ink); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: var(--gap); }
.banner-ex .chip { display: none; }
.banner-ex button { margin-left: auto; height: 30px; }

.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 0 16px; height: 44px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { height: 38px; font-size: 12px; color: var(--muted); font-weight: 400; background: none; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
thead th[aria-sort] { color: var(--text); font-weight: 500; }
thead th[aria-sort]::after { content: " ↑"; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--raised); }
tr.best td:nth-child(2) { color: var(--data); font-weight: 700; }
td a { color: var(--text); text-decoration: none; font-weight: 500; }
td a:hover { text-decoration: underline; }
.dim { color: var(--muted); }

.apts { display: flex; flex-direction: column; gap: var(--gap); }
.apt { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 16px; }
@media (max-width: 760px) { .apt { grid-template-columns: minmax(0, 1fr); } }
.apt-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; grid-column: 1 / -1; }
.apt-head input[type="text"] { flex: 1 1 220px; font-weight: 500; font-size: 15px; height: 36px; }
.apt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--gap); }
.apt-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.apt-grid .num, .apt-grid .num input { width: 100%; }
.apt-out { background: var(--raised); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.apt-out .chips { display: flex; gap: 6px; flex-wrap: wrap; }

.rooms { columns: 2 440px; column-gap: var(--gap); }
.rooms > .room { break-inside: avoid; margin-bottom: var(--gap); }
.room h4 { margin: 0 0 4px; display: flex; justify-content: space-between; font-size: 15px; font-weight: 500; }
.room h4 span { font-weight: 500; color: var(--muted); font-size: 14px; }
.item { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; min-height: 44px; border-bottom: 1px solid var(--rule); font-size: 14px; }
.item:last-child { border-bottom: 0; }
.item.have .nm { text-decoration: line-through; color: var(--muted); }
.item .num input { width: 5.2em; }
.item .ess { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--text); cursor: pointer; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ol.steps.two { display: block; columns: 2 400px; column-gap: 48px; }
ol.steps.two > .step { break-inside: avoid; }
.step { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.steps:not(.two) .step:last-child { border-bottom: 0; }
.step .n { display: none; }
.step h4 { margin: 0; font-size: 15px; font-weight: 500; }
.step p { margin: 2px 0 0; color: var(--muted); font-size: 14px; max-width: 72ch; }
.step.done h4 { color: var(--muted); text-decoration: line-through; }
.progress { height: 8px; background: var(--raised); border-radius: 4px; overflow: hidden; }
.progress b { display: block; height: 100%; background: var(--data); border-radius: 4px; }
.row { display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
a { color: var(--text); text-underline-offset: 2px; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.evid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 20px; }
.evid > div { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.evid p { margin: 0; font-size: 14px; }
.evid a { font-size: 12px; color: var(--muted); }
svg text { font-family: var(--f-body); }
@media (prefers-reduced-motion: no-preference) { .bar b, .progress b { transition: width .35s ease; } }
.move textarea { width: 100%; margin-top: 12px; font: 400 13px var(--f-body); border: 1px solid var(--control); border-radius: var(--r-control); background: var(--surface); color: var(--text); padding: 8px; resize: vertical; }
/* Showings */
.show input[type="text"], .show input[type="url"], .show select { font: 400 13px var(--f-body); height: 32px; border: 1px solid var(--control); border-radius: var(--r-control); background: var(--surface); color: var(--text); padding: 0 8px; min-width: 0; }
.show label.paste { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); margin-top: 12px; }
.show label.paste input { width: 100%; }
.crawl { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.crawl .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--control); flex: none; }
.crawl .dot.running { background: var(--data); animation: pulse 1.2s ease-in-out infinite; }
.crawl .dot.done { background: var(--positive); }
.crawl .dot.blocked, .crawl .dot.error, .crawl .dot.denied { background: var(--negative); }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .crawl .dot.running { animation: none; } }
#tabs button.busy::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--data); margin-left: 6px; vertical-align: middle; }
.hood-group h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 2px; }
.hood-row { display: grid; grid-template-columns: minmax(0, 1fr) 24px 112px; gap: 4px 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.hood-row label { display: flex; gap: 8px; align-items: center; min-width: 0; }
.hood-row input[type="text"] { grid-column: 1 / -1; }
.hood-row.never label { color: var(--muted); text-decoration: line-through; }
.my-area { padding: 10px 0; border-top: 1px solid var(--rule); display: grid; gap: 6px; }
.my-area:first-of-type { border-top: 0; }
.my-area ul { margin: 0; padding: 0; list-style: none; font-size: 13px; display: grid; gap: 4px; }
.my-area li { display: flex; flex-wrap: wrap; gap: 2px 8px; }
.my-area li em { flex-basis: 100%; color: var(--muted); }
.show-day { font-size: var(--fs-section); margin: 22px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.show-day .dim { font-size: 13px; font-weight: 400; }
.show-card { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 18px; }
.show-card + .show-card { margin-top: 8px; }
.show-card.never { opacity: .5; }
.show-card .t { font-weight: 600; font-variant-numeric: tabular-nums; padding-top: 1px; }
.show-card p { margin: 4px 0 6px; font-size: 14px; }
.show-card a { color: var(--text); }
.show-card details.desc { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.show-card details.desc summary { cursor: pointer; color: var(--text); font-size: 13px; }
.show-card details.desc p { margin: 6px 0 0; font-size: 13px; }
.facts a { color: var(--text); }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.visit { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; margin-top: 10px; }
.sc-act { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
@media (max-width: 900px) { .bench.show > div:last-child { order: -1; } }

// Plans saved before v2 kept the stricter stress-test defaults; move them to the new ones unless the user changed them
function migrate() {
  if (!(S.v >= 2)) {
    if (S.fin.living === 11500) S.fin.living = 9000;
    if (S.fin.stress === 7) S.fin.stress = 6.5;
  }
  if (!(S.v >= 3)) {
    // v3: net salary is calculated from gross, and only inner-city areas remain
    S.fin.netAuto = true;
    if (S.search.area === "1" || S.search.area === "2") S.search.area = "115341";
  }
  if (!AREAS[S.value.area]) S.value.area = "centrala-stockholm";
  S.v = 3;
}
function merge(base, saved) {
  if (!saved || typeof saved !== "object") return base;
  if (Array.isArray(base)) return Array.isArray(saved) ? saved : base;
  const out = { ...base };
  for (const k of Object.keys(saved)) {
    const b = base[k], s = saved[k];
    out[k] = b && typeof b === "object" && !Array.isArray(b) && s && typeof s === "object" && !Array.isArray(s) ? merge(b, s) : s;
  }
  return out;
}

/* ---------- Persistence: private per-person doc in db, browser storage as fallback ---------- */
const LS_KEY = "sthlm-bostadsplan-v1";
let docRef = null, saveTimer = null, saving = false, pending = false;
function setSaveState(text, ok) {
  const el = document.getElementById("saveState");
  el.className = "save-state" + (ok ? " ok" : "");
  el.querySelector("span").textContent = text;
}
function lsRead() { try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }
function scheduleSave() {
  clearTimeout(saveTimer);
  setSaveState("Unsaved changes", false);
  saveTimer = setTimeout(flush, 1200);
}
async function flush() {
  const local = lsWrite();
  if (LOCAL) {
    try {
      const r = await fetch("/api/plan", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ plan: S, scrape: scrapeConfig() }) });
      if (!r.ok) throw new Error(r.status);
      setSaveState("Saved on this computer", true);
    } catch (e) { setSaveState(local ? "Saved in this browser only, the server isn't answering" : "Not saved", local); }
    return;
  }
  if (!docRef) { setSaveState(local ? "Saved in this browser" : "Not saved (storage blocked)", local); return; }
  if (saving) { pending = true; return; }
  saving = true;
  try { await docRef.set({ plan: JSON.stringify(S), savedAt: new Date().toISOString() }); setSaveState("Saved to your account", true); }
  catch (e) { setSaveState(local ? "Saved in this browser" : "Not saved", local); }
  saving = false;
  if (pending) { pending = false; flush(); }
}
async function initStore() {
  const local = lsRead();
  if (local) { S = merge(DEFAULT(), local); migrate(); render(); }
  setSaveState(local ? "Saved in this browser" : "Example plan", !!local);
  if (LOCAL) {
    try {
      const r = await fetch("/api/plan", { cache: "no-store" });
      if (r.ok) { S = merge(DEFAULT(), await r.json()); migrate(); render(); }
      await flush(); // moves a browser-only plan to the server and gives the scraper this plan's areas and budget
    } catch (e) { setSaveState("The local server isn't answering, saving in this browser", !!local); }
    return;
  }
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    docRef = db.collection("data/users/" + id).doc("plan");
    const snap = await Promise.race([docRef.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    if (snap.exists) {
      const d = snap.data();
      try { S = merge(DEFAULT(), JSON.parse(d.plan)); migrate(); render(); } catch (e) {}
      setSaveState("Saved to your account", true);
    } else {
      setSaveState(local ? "Saved in this browser" : "Example plan, saves to your account when you edit", !!local);
    }
  } catch (e) { docRef = docRef || null; }
}

/* ---------- Formatting ---------- */
const nf = new Intl.NumberFormat("sv-SE", { maximumFractionDigits: 0 });
const kr = (n) => (isFinite(n) ? nf.format(Math.round(n)) : "–") + " kr";
const pct = (n, d = 2) => (n == null || !isFinite(n) ? "–" : n.toFixed(d).replace(".", ",") + " %");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mkr = (n) => (n / 1e6).toFixed(2).replace(".", ",") + " Mkr";

/* ---------- Calculations ---------- */
function amortRate(ltv) { return ltv > 0.7 ? 0.02 : ltv > 0.5 ? 0.01 : 0; }
function interestAfterDeduction(annualInterest) {
  const ded = Math.min(annualInterest, 100000) * 0.30 + Math.max(0, annualInterest - 100000) * 0.21;
  return annualInterest - ded;
}
function bestRate(binding) {
  const vals = BANKS.map((b) => b.r[binding]).filter((v) => v != null);
  return Math.min(...vals);
}
function chosenRate() {
  const r = S.rates;
  if (r.mode === "offer" && r.offer > 0) return { rate: r.offer, label: "your offer" };
  if (r.mode === "snitt") {
    const big = BANKS.filter((b) => b.snitt != null && ["SBAB", "Swedbank", "Handelsbanken", "SEB", "Länsförsäkringar"].includes(b.name));
    const avg = big.reduce((a, b) => a + b.snitt, 0) / big.length;
    return { rate: avg, label: "big-bank average rate (snittränta)" };
  }
  const b = BINDINGS.find((x) => x[0] === r.binding)[1];
  return { rate: bestRate(r.binding), label: "best list rate, " + b };
}
function furnitureTotal(tierOverride) {
  const f = S.furn, ti = TIERS.findIndex((t) => t[0] === (tierOverride || f.tier));
  let total = 0, have = 0, count = 0;
  for (const [, items] of FURNITURE) for (const [id, , prices, qty0, ess] of items) {
    const st = f.items[id] || {};
    if (f.essentialsOnly && !ess) continue;
    const qty = st.qty ?? qty0;
    const price = (st.price ?? prices[ti]) * qty;
    if (st.have) { have += price; continue; }
    total += price; count++;
  }
  for (const x of f.extra) { if (x.have) continue; total += (+x.price || 0) * (+x.qty || 1); count++; }
  return { total, have, count };
}
// Preliminary tax as Skatteverket's 2026 monthly tables compute it (SKV 433, teknisk beskrivning 2025-12-10):
// Stockholm's 30,55 % plus 0,07 % begravningsavgift, rounded to the table's whole percent.
const TAX = { kommun: 30.55, burial: 0.07, church: 1.0, skikt: 643000, publicMax: 1184 };
function monthlyTax(gross, church) {
  if (!(gross > 0)) return 0;
  const T = Math.round(TAX.kommun + TAX.burial + (church ? TAX.church : 0)); // the table number, e.g. 31
  const step = gross <= 20000 ? 100 : gross <= 80000 ? 200 : 1;               // the table's income intervals
  const FFI = Math.floor(Math.ceil(gross / step) * step * 12 / 100) * 100;
  let ga;
  if (FFI <= 0.99 * PBB) ga = 0.423 * PBB;
  else if (FFI <= 2.72 * PBB) ga = 0.423 * PBB + 0.2 * (FFI - 0.99 * PBB);
  else if (FFI <= 3.11 * PBB) ga = 0.77 * PBB;
  else if (FFI <= 7.88 * PBB) ga = 0.77 * PBB - 0.1 * (FFI - 3.11 * PBB);
  else ga = 0.293 * PBB;
  ga = Math.min(FFI, Math.ceil(ga / 100) * 100);
  const BFI = FFI - ga, KI = (T - 1.16) / 100;
  const municipal = Math.floor(BFI * KI), fees = Math.floor(BFI * 0.0116);
  const state = BFI - TAX.skikt >= 200 ? Math.floor(0.2 * (BFI - TAX.skikt)) : 0;
  let jsa; // jobbskatteavdrag, under 66
  if (FFI <= 0.91 * PBB) jsa = (FFI - ga) * KI;
  else if (FFI <= 3.24 * PBB) jsa = (0.91 * PBB + 0.3874 * (FFI - 0.91 * PBB) - ga) * KI;
  else if (FFI <= 8.08 * PBB) jsa = (1.813 * PBB + 0.251 * (FFI - 3.24 * PBB) - ga) * KI;
  else jsa = (3.027 * PBB - ga) * KI;
  const srf = BFI <= 40000 ? 0 : BFI <= 240000 ? Math.floor(0.0075 * (BFI - 40000)) : 1500; // skattereduktion för förvärvsinkomst
  const muni = Math.max(0, municipal - Math.max(0, Math.floor(jsa)) - srf);
  const pub = Math.min(TAX.publicMax, Math.floor(BFI * 0.01));
  return Math.round((muni + fees + state + pub) / 12);
}
function netOf(gross) { return Math.max(0, (+gross || 0) - monthlyTax(+gross || 0, S.fin.church)); }
function household() {
  const f = S.fin, two = f.buyers === 2;
  return {
    gross: (+f.gross1 || 0) + (two ? +f.gross2 || 0 : 0),
    net: f.netAuto ? netOf(f.gross1) + (two ? netOf(f.gross2) : 0) : (+f.net1 || 0) + (two ? +f.net2 || 0 : 0),
  };
}
function closingFees() { return FEE_TRANSFER + FEE_PLEDGE; }
function cashAvailable() {
  const f = S.fin;
  const furn = f.reserveFurniture ? furnitureTotal().total : 0;
  return (+f.savings || 0) - (+f.buffer || 0) - closingFees() - furn;
}
// Monthly KALP surplus at a given loan size and price
function kalpSurplus(loan, price) {
  const f = S.fin, h = household();
  const ltv = price > 0 ? loan / price : 0;
  const housing = (+f.targetAvgift || 0) + 900; // + el, insurance, broadband
  const interest = loan * (+f.stress || 0) / 100;
  const interestCost = f.kalpDeduction ? interestAfterDeduction(interest) : interest;
  return h.net - (+f.living || 0) - (+f.otherDebtMonthly || 0) - housing - interestCost / 12 - loan * amortRate(ltv) / 12;
}
function affordability() {
  const f = S.fin, h = household();
  const cash = Math.max(0, cashAvailable());
  const mult = +f.incomeMult || 5.5, offer = +f.bankOffer || 0;
  const incomeCap = Math.max(0, mult * h.gross * 12 - (+f.otherDebt || 0));
  const byCash = cash / 0.10;
  const byIncome = cash + incomeCap;
  // largest price where KALP surplus >= 0 (loan = price - cash)
  let lo = 0, hi = 30e6;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2, loan = Math.max(0, mid - cash);
    if (kalpSurplus(loan, mid) >= 0) lo = mid; else hi = mid;
  }
  const byKalp = kalpSurplus(0, 0) < 0 ? 0 : lo;
  const multTxt = String(mult).replace(".", ",");
  const limits = [
    { key: "cash", label: "Cash (10 % insats)", value: byCash, hint: "Your savings after buffer, fees" + (f.reserveFurniture ? " and furniture" : "") + " must cover 10 % of the price." },
  ];
  // A real lånelöfte replaces the two estimates; they stay visible for comparison
  if (offer) limits.push({ key: "offer", label: "Your lånelöfte", value: cash + offer, hint: "Your bank offered to lend " + kr(offer) + ", so that sets the loan." });
  limits.push(
    { key: "income", label: (offer ? "Estimate: " : "") + "Income (" + multTxt + "× gross)", value: byIncome, unused: !!offer, hint: "Banks lend up to about " + multTxt + " times your yearly gross income, minus other debt. Some go higher." },
    { key: "kalp", label: (offer ? "Estimate: " : "") + "Bank stress test", value: byKalp, unused: !!offer, hint: "The bank's KALP check: at a " + String(f.stress).replace(".", ",") + " % stress rate" + (f.kalpDeduction ? " after ränteavdrag" : "") + ", your net income must still cover loan, avgift and living costs." },
  );
  const used = limits.filter((l) => !l.unused);
  const binding = used.reduce((a, b) => (b.value < a.value ? b : a));
  const max = Math.max(0, binding.value);
  return { cash, incomeCap, max, limits, binding };
}
function monthlyCost(price, avgift, rate, cashIn) {
  const cash = cashIn ?? Math.max(0, cashAvailable());
  const insats = Math.min(price, Math.max(price * 0.10, cash));
  const loan = Math.max(0, price - insats);
  const ltv = price > 0 ? loan / price : 0;
  const interest = loan * rate / 100;
  const interestNet = interestAfterDeduction(interest) / 12;
  const amort = loan * amortRate(ltv) / 12;
  const running = 900;
  return { loan, insats, ltv, interestGross: interest / 12, interestNet, amort, avgift: +avgift || 0, running, total: interestNet + amort + (+avgift || 0) + running, cashShort: price * 0.10 > cash };
}

const AREAS = {
  "centrala-stockholm": { name: "Hela innerstan", from: 2005, now: 121933, v: [38397,44867,52377,50011,51348,56381,57957,59179,64243,71205,84465,89645,92442,87291,89225,95218,104868,107183,103673,107725,111823] },

const BUY_YEAR = 2026;
// Booli area ids, checked on booli.se (30 Oct 2026)
const BOOLI_AREAS = [["115341", "Södermalm"], ["1", "All of Stockholms kommun"]];
// Log-linear least squares: ln(kr/kvm) = a + b·year, over the last `win` years (0 = all)
function regress(key, win) {
  const A = AREAS[key] || AREAS["centrala-stockholm"];
  let pts = A.v.map((v, i) => [A.from + i, v]);
  if (win > 0) pts = pts.slice(-win);
  const n = pts.length, xs = pts.map((p) => p[0]), ys = pts.map((p) => Math.log(p[1]));
  const xbar = xs.reduce((a, b) => a + b, 0) / n, ybar = ys.reduce((a, b) => a + b, 0) / n;
  let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < n; i++) { sxx += (xs[i] - xbar) ** 2; sxy += (xs[i] - xbar) * (ys[i] - ybar); syy += (ys[i] - ybar) ** 2; }
  const b = sxy / sxx, a = ybar - b * xbar;
  const sse = ys.reduce((s, y, i) => s + (y - a - b * xs[i]) ** 2, 0);
  const s = Math.sqrt(sse / Math.max(1, n - 2));
  const r2 = syy ? 1 - sse / syy : 0;
  const pred = (x) => {
    const m = a + b * x, w = 1.96 * s * Math.sqrt(1 + 1 / n + (x - xbar) ** 2 / sxx);
    return { mid: Math.exp(m), lo: Math.exp(m - w), hi: Math.exp(m + w) };
  };
  return { A, pts, n, a, b, s, r2, g: Math.exp(b) - 1, pred };
}
function valueGrowth() {
  const V = S.value;
  return V.mode === "manual" ? (+V.manual || 0) / 100 : regress(V.area, +V.win).g;
}
// Apartment value t years after purchase: central trend plus 95 % prediction band
function valueAt(price, t) {
  const V = S.value;
  if (V.mode === "manual") { const v = price * Math.pow(1 + valueGrowth(), t); return { mid: v, lo: v, hi: v }; }
  const R = regress(V.area, +V.win), base = R.pred(BUY_YEAR).mid, p = R.pred(BUY_YEAR + t);
  return { mid: price * p.mid / base, lo: price * p.lo / base, hi: price * p.hi / base };
}

// Five-year projection for one rate scenario, in today's money (wage and costs assumed to move together)
function projectFive(sc) {
  const f = S.fin, F = S.five, h = household(), cr = chosenRate();
  const price = +f.targetPrice || affordability().max;
  const start = monthlyCost(price, f.targetAvgift, cr.rate);
  let loan = start.loan, saved = +f.buffer || 0;
  const years = [];
  for (let y = 0; y < 5; y++) {
    const rate = Math.max(0, cr.rate + (+sc.dr[y] || 0));
    const avgift = (+f.targetAvgift || 0) * Math.pow(1 + (+F.avgiftExtra || 0) / 100, y);
    const interestNet = interestAfterDeduction(loan * rate / 100) / 12;
    const amort = Math.min(loan, start.loan * amortRate(loan / price)) / 12;
    const housing = interestNet + amort + avgift + 900;
    const left = h.net - (+f.living || 0) - (+f.otherDebtMonthly || 0) - housing;
    saved += left * 12;
    loan -= amort * 12;
    const val = valueAt(price, y + 1);
    years.push({ y: y + 1, rate, avgift, interestNet, amort, housing, left, saved, loan, value: val.mid, valueLo: val.lo, valueHi: val.hi, equity: val.mid - loan });
  }
  return years;
}

  },
  fiveOut() {
    const F = S.five, keys = Object.keys(F.scen);
    const all = keys.map((k) => projectFive(F.scen[k]));
    const pick = keys.includes(F.pick) ? F.pick : keys[0];
    const P = all[keys.indexOf(pick)];
    const W = 640, H = 240, L = 64, R = 120, T = 16, B = 30;
    const vals = all.flat().map((r) => r.left);
    let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
    const span = hi - lo || 1000, stepRaw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= stepRaw);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const x = (i) => L + (i * (W - L - R)) / 4, yv = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);
    const ticks = []; for (let v = lo; v <= hi + 1e-6; v += step) ticks.push(v);

      ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${yv(v)}" y2="${yv(v)}" stroke="${v === 0 ? "var(--muted)" : "var(--line)"}" stroke-width="${v === 0 ? 1.5 : 1}"/><text x="${L - 8}" y="${yv(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${nf.format(v)}</text>`).join("")}
      ${[0, 1, 2, 3, 4].map((i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">Year ${i + 1}</text>`).join("")}
      ${all.map((rows, si) => { const on = keys[si] === pick; const c = on ? "var(--data)" : "var(--chart-2)"; return `<polyline fill="none" stroke="${c}" stroke-width="${on ? 2.5 : 1.5}" points="${rows.map((r, i) => `${x(i)},${yv(r.left)}`).join(" ")}"/>${on ? rows.map((r, i) => `<circle cx="${x(i)}" cy="${yv(r.left)}" r="3.5" fill="${c}"/>`).join("") : ""}`; }).join("")}
      ${(() => { const ls = all.map((rows, si) => ({ y: yv(rows[4].left), name: F.scen[keys[si]].name, on: keys[si] === pick })).sort((a, b) => a.y - b.y); for (let i = 1; i < ls.length; i++) ls[i].y = Math.max(ls[i].y, ls[i - 1].y + 14); return ls.map((l) => `<text x="${x(4) + 10}" y="${l.y + 4}" font-size="12" fill="${l.on ? "var(--text)" : "var(--muted)"}" font-weight="${l.on ? 500 : 400}">${esc(l.name)}</text>`).join(""); })()}
    </svg>`;
    const sum = all.map((rows, i) => ({ k: keys[i], min: Math.min(...rows.map((r) => r.left)), end: rows[4] }));
    return `
      <section class="panel">
        <span class="eyebrow">Money left each month after all costs</span>
        <div class="seg" style="margin:8px 0 10px">${keys.map((k, i) => `<button data-set="five.pick" data-val="${k}" aria-pressed="${k === pick}"><span class="sw" style="background:${k === pick ? "var(--data)" : "var(--chart-2)"}"></span>${esc(F.scen[k].name)}</button>`).join("")}</div>
        <div style="overflow-x:auto">${svg}</div>
        <div class="tiles" style="margin-top:16px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${sum.map((w, i) => `
          <div class="tile" style="cursor:default"><span class="eyebrow"><span class="sw" style="background:${w.k === pick ? "var(--data)" : "var(--chart-2)"}"></span>${esc(F.scen[w.k].name)}</span>
          <span class="v" style="font-size:1.1rem;color:${w.min < 0 ? "var(--bad)" : w.min < 3000 ? "var(--warn)" : "var(--ink)"}">${kr(w.min)}</span><span class="s">in the tightest month; ${kr(w.end.saved)} saved by year 5</span></div>`).join("")}</div>
      </section>
      `;
  },
  fiveTable() {

  growthOut() {
    const V = S.value;
    const wins = [[0, "All years"], [15, "15 years"], [10, "10 years"], [5, "5 years"]].map(([w, l]) => ({ w, l, r: regress(V.area, w) }));
    return `      <section class="panel"><h3>Growth depends on the period you look at</h3>
        <dl class="kv">${wins.map((o) => `<dt>${o.l} (${o.r.pts[0][0]}–${o.r.pts.at(-1)[0]})</dt><dd>${pct(o.r.g * 100, 1)} / year</dd>`).join("")}</dl>

      </section>`;

  valueOut() {
    const V = S.value, R = regress(V.area, +V.win), A = R.A;
    const allPts = A.v.map((v, i) => [A.from + i, v]);
    const x0 = A.from, x1 = BUY_YEAR + 5;
    const proj = []; for (let yr = BUY_YEAR - 1; yr <= x1; yr++) proj.push([yr, R.pred(yr)]);
    const ymax = Math.max(...allPts.map((p) => p[1]), ...proj.map((p) => p[1].hi));
    const W = 660, H = 280, L = 62, Rr = 16, T = 14, B = 28;
    const stepRaw = ymax / 5, mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= stepRaw), top = Math.ceil(ymax / step) * step;
    const x = (yr) => L + ((yr - x0) / (x1 - x0)) * (W - L - Rr), y = (v) => T + (1 - v / top) * (H - T - B);
    const ticks = []; for (let v = 0; v <= top + 1e-6; v += step) ticks.push(v);
    const xt = []; for (let yr = Math.ceil(x0 / 5) * 5; yr <= x1; yr += 5) xt.push(yr);
    const fitFrom = R.pts[0][0], fit = []; for (let yr = fitFrom; yr <= BUY_YEAR - 1; yr++) fit.push([yr, R.pred(yr).mid]);
    const band = proj.map(([yr, p]) => `${x(yr)},${y(p.hi)}`).join(" ") + " " + proj.slice().reverse().map(([yr, p]) => `${x(yr)},${y(p.lo)}`).join(" ");
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price per kvm history and trend for ${esc(A.name)}" style="width:100%;height:auto;display:block">
      ${ticks.map((v) => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v ? nf.format(v / 1000) + "k" : "0"}</text>`).join("")}
      ${xt.map((yr) => `<text x="${x(yr)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${yr}</text>`).join("")}
      <rect x="${x(fitFrom) - 4}" y="${T}" width="${x(BUY_YEAR - 1) - x(fitFrom) + 8}" height="${H - T - B}" fill="var(--accent-soft)" opacity=".5"/>
      <polygon points="${band}" fill="var(--accent)" opacity=".15"/>
      <polyline fill="none" stroke="var(--muted)" stroke-width="1.5" points="${allPts.map(([yr, v]) => `${x(yr)},${y(v)}`).join(" ")}"/>
      ${allPts.map(([yr, v]) => `<circle cx="${x(yr)}" cy="${y(v)}" r="3" fill="${yr >= fitFrom ? "var(--ink)" : "var(--muted)"}"><title>${yr}: ${nf.format(v)} kr/kvm</title></circle>`).join("")}
      <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${fit.map(([yr, v]) => `${x(yr)},${y(v)}`).join(" ")}"/>
      <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 5" points="${proj.map(([yr, p]) => `${x(yr)},${y(p.mid)}`).join(" ")}"/>
      <circle cx="${x(x1)}" cy="${y(proj.at(-1)[1].mid)}" r="4.5" fill="var(--accent)"/>
    </svg>`;
    const price = +S.fin.targetPrice || 0;
    const v5 = valueAt(price, 5), pR = R.pred(x1);
    return `
      <section class="panel">
        <div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="eyebrow">${esc(A.name)} · kr/kvm</span><span class="dim" style="font-size:.78rem">Dots: actual · line: fitted trend · dashed: projection with 95 % range</span></div>
        <div style="overflow-x:auto">${svg}</div>
      </section>
      <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
        <div class="tile" style="cursor:default"><span class="eyebrow">Trend growth</span><span class="v">${pct(R.g * 100, 1)}</span><span class="s">a year, ${R.pts[0][0]}–${R.pts.at(-1)[0]} · R² ${R.r2.toFixed(2).replace(".", ",")}</span></div>
        <div class="tile" style="cursor:default"><span class="eyebrow">Last 3 months</span><span class="v">${nf.format(A.now)}</span><span class="s">kr/kvm, to 8 Oct 2026</span></div>
        <div class="tile" style="cursor:default"><span class="eyebrow">Area in ${x1}</span><span class="v">${nf.format(pR.mid)}</span><span class="s">kr/kvm, range ${nf.format(pR.lo)}–${nf.format(pR.hi)}</span></div>
        <div class="tile" style="cursor:default"><span class="eyebrow">Your ${mkr(price)} apartment in ${x1}</span><span class="v">${mkr(v5.mid)}</span><span class="s">range ${mkr(v5.lo)}–${mkr(v5.hi)}</span></div>
      </div>
`;
  },

    return `

      <section class="panel" style="margin-top:20px"><h3>What the research says</h3>

  bidOut() {

    // Suggested plan: open near asking, small steps through the middle, one firm jump to around 90 % of the walk-away price, then stop at the walk-away price

}

// Update live outputs without rebuilding inputs (keeps focus while typing)
// Update the page in place: only what changed is touched, and the field being edited is left alone
function morph(from, to) {
  if (from.nodeType !== to.nodeType || from.nodeName !== to.nodeName) { from.replaceWith(to.cloneNode(true)); return; }
  if (from.nodeType === 3 || from.nodeType === 8) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
  if (from === document.activeElement && (from.tagName === "INPUT" || from.tagName === "SELECT")) return;
  for (const a of [...from.attributes]) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
  for (const a of [...to.attributes]) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  if (from.tagName === "INPUT") {
    if (from.type === "checkbox") from.checked = to.hasAttribute("checked");
    else if (from.value !== (to.getAttribute("value") ?? "")) from.value = to.getAttribute("value") ?? "";
    return;
  }
  morphChildren(from, to);
  if (from.tagName === "SELECT") from.value = to.value;
}
function morphChildren(from, to) {
  const f = [...from.childNodes], t = [...to.childNodes];
  t.forEach((node, i) => (f[i] ? morph(f[i], node) : from.appendChild(node.cloneNode(true))));
  for (let i = t.length; i < f.length; i++) f[i].remove();
}
function refresh() {
  const next = document.createElement("main");
  next.innerHTML = VIEWS[S.tab]();
  morphChildren(app, next);
}

/* ---------- Booli search links: your budget, or a filter pasted from Booli ---------- */
function budgetFilter() {
  const s = S.search, a = affordability(), p = new URLSearchParams({ objectType: "Lägenhet" });
  const to = +S.show.maxPrice > 0 ? +S.show.maxPrice : Math.floor(a.max * (1 - s.headroom / 100) / 50000) * 50000;
  if (to > 0) p.set("maxListPrice", to);
  if (s.minRooms) p.set("minRooms", s.minRooms);
  if (s.minArea) p.set("minLivingArea", s.minArea);
  if (s.maxAvgift) p.set("maxRent", s.maxAvgift);
  return p.toString();
}
function searchUrl(ids, page) {
  const p = new URLSearchParams(S.show.filter || budgetFilter());
  if (!p.has("objectType")) p.set("objectType", "Lägenhet");
  p.set("areaIds", ids.join(","));
  if (page > 1) p.set("page", page);
  return `${BOOLI}/sok/till-salu?${p.toString().replace(/%2C/g, ",")}`;
}
function parseBooliLink(str) {
  let u; try { u = new URL(String(str).trim()); } catch (e) { return null; }
  if (u.hostname.replace(/^www\./, "") !== "booli.se") return null;
  const p = new URLSearchParams(u.search);
  const ids = (p.get("areaIds") || "").split(",").map((x) => x.trim()).filter((x) => /^\d+$/.test(x));
  p.delete("areaIds"); p.delete("page");
  return { ids, filter: p.toString() };
}
const FILTER_LABELS = { maxListPrice: ["Max price", "kr"], minListPrice: ["Min price", "kr"], minRooms: ["Min rooms", ""], maxRooms: ["Max rooms", ""],
  minLivingArea: ["Min area", "m²"], maxLivingArea: ["Max area", "m²"], maxRent: ["Max avgift", "kr/mån"], minFloor: ["Min floor", ""], upcomingSale: ["Coming soon", ""] };
function filterChips(q) {
  return [...new URLSearchParams(q)].filter(([k]) => k !== "objectType").map(([k, v]) => {
    const [label, unit] = FILTER_LABELS[k] || [k, ""];
    return `<span class="chip">${esc(label)} ${/^\d+$/.test(v) ? nf.format(+v) : esc(v)}${unit ? " " + unit : ""}</span>`;
  }).join("") || `<span class="chip">No filters</span>`;
}

/* ---------- Showings view ---------- */
function showWindow(mode, now) {
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (mode === "week") {
    const mon = new Date(today); mon.setDate(today.getDate() + ((8 - today.getDay()) % 7 || 7));
    const end = new Date(mon); end.setDate(mon.getDate() + 7);
    return [isoLocal(mon), isoLocal(end)];
  }
  const end = new Date(today); end.setDate(today.getDate() + (mode === "all" ? 60 : 8));
  return [isoLocal(now), isoLocal(end)];
}
function showingsIn(p, from, to) {
  // The estate agent's own times win; Booli's next showing fills in when the agent lists none
  const starts = (p.shows || []).map((s) => ({ ...s }));
  if (p.next && !starts.length) starts.push({ start: p.next });
  return starts.filter((s) => s.start >= from && s.start < to).sort((a, b) => (a.start < b.start ? -1 : 1));
}
function describeListing(p) {
  const bits = [];
  bits.push([p.rooms ? String(p.rooms).replace(".", ",") + " rum" : "Apartment", p.kvm ? String(p.kvm).replace(".", ",") + " m²" : ""].filter(Boolean).join(", "));
  if (p.floor) bits[0] += p.floor === "BV" ? " on the ground floor" : ` on floor ${p.floor}`;
  // Booli's features first, then what the agent's description adds, at most six so the sentence stays readable
  const f = [...new Set([...(p.feats || []).map((x) => FEATS[x]), ...(p.extra || [])])].slice(0, 6);
  if (f.length) bits[0] += " with " + (f.length > 1 ? f.slice(0, -1).join(", ") + " and " + f[f.length - 1] : f[0]);
  if (p.built) bits.push(`built ${p.built}`);
  if (p.avgift && p.kvm) {
    const y = p.avgift * 12 / p.kvm;
    if (y < 650) bits.push("low avgift for its size"); else if (y > 1000) bits.push("high avgift for its size");
  }
  if (p.days > 21) bits.push(`on the market for ${p.days} days`);
  return bits.join(", ") + ".";
}

    set(t.dataset.path, val);
    if (S.example && t.dataset.path.startsWith("fin.")) S.example = false;
    if (t.tagName === "SELECT" || t.id === "f-areaid") return changed(true);
    return changed(false);
  }
  if (t.dataset.apt) {
    const p = S.apts.find((x) => x.id === t.dataset.apt); if (!p) return;
    p[t.dataset.k] = val; if (p.example && t.dataset.k !== "status") p.example = false;
    return changed(false);
  }
  if (t.dataset.five) { S.five.scen[t.dataset.five].dr[+t.dataset.y] = val ?? 0; return changed(false); }
  const f = S.furn;
  for (const k of ["qty", "price"]) if (t.dataset[k]) {
    f.items[t.dataset[k]] = { ...(f.items[t.dataset[k]] || {}), [k]: val };
    return changed(false);
  }
  const xid = t.dataset.xname || t.dataset.xprice;
  if (xid) { const x = f.extra.find((i) => i.id === xid); if (x) x[t.dataset.xname ? "name" : "price"] = val; return changed(false); }
});
app.addEventListener("change", (e) => {
  const t = e.target;
  if (showChange(t)) return;
  if (t.id === "plan-file" && t.files && t.files[0]) { t.files[0].text().then(importPlan); t.value = ""; return; }
  if (t.dataset.check) { set(t.dataset.check, t.checked); return changed(true); }
  if (t.dataset.have) { S.furn.items[t.dataset.have] = { ...(S.furn.items[t.dataset.have] || {}), have: t.checked }; return changed(true); }
  if (t.dataset.xhave) { const x = S.furn.extra.find((i) => i.id === t.dataset.xhave); if (x) x.have = t.checked; return changed(true); }
  if (t.dataset.step) { S.steps[t.dataset.step] = t.checked; return changed(true); }
  if (t.dataset.xprice || t.dataset.price || t.dataset.qty) return changed(true);
});
// Tidy a number field when you leave it: "2500000" becomes "2 500 000"
app.addEventListener("focusout", (e) => {
  const t = e.target;
  if (!t.hasAttribute || !t.hasAttribute("data-num")) return;
  const v = parseNum(t.value);
  if (v !== undefined) t.value = fmtIn(v);
});
app.addEventListener("click", (e) => {
  const g = e.target.closest("[data-goto]"); if (g) { S.tab = g.dataset.goto; render(); window.scrollTo(0, 0); return; }
  const s = e.target.closest("[data-set]");
  if (s) { const v = s.dataset.val; set(s.dataset.set, /^\d+$/.test(v) && ["fin.buyers", "value.win"].includes(s.dataset.set) ? +v : v); return changed(true); }
  const th = e.target.closest("th[data-sort]"); if (th) { S.rates.sort = th.dataset.sort; return changed(true); }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const sc = showClick(a); if (sc === true) return; if (sc === false) return changed(true);
  if (a.dataset.act === "plan-export") return exportPlan();
  if (a.dataset.act === "plan-copy") return copyPlan();
  if (a.dataset.act === "plan-import") return importPlan(document.getElementById("plan-paste").value);
  const id = () => Math.random().toString(36).slice(2, 9);
  switch (a.dataset.act) {
    case "clear-example": clearExample(); break;
    case "walk-max": S.bid.walk = Math.floor(affordability().max / 5000) * 5000; break;
    case "add-apt": S.apts.unshift({ id: id(), address: "", price: null, bid: null, avgift: null, kvm: null, rooms: null, debtKvm: null, link: "", status: "Watching" }); break;
    case "del-apt": S.apts = S.apts.filter((x) => x.id !== a.dataset.id); break;
    case "add-extra": S.furn.extra.push({ id: id(), name: "", price: null, qty: 1, have: false }); break;
    case "del-extra": S.furn.extra = S.furn.extra.filter((x) => x.id !== a.dataset.id); break;
  }
  changed(true);
});

render();
initStore().then(async () => {
  await loadList();
  pollStatus();
});
</script>
</body>
</html>
