      <div class="facts"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.agent)} ↗</a><span>${price ? kr(price) : "Pris ej satt"}</span>${p.avgift ? `<span>Avgift ${kr(p.avgift)}</span>` : ""}${mc ? `<span>${kr(mc.total)}/mån allt inräknat</span>` : ""}${fit}</div>
      ${v ? `<div class="visit">${ratingSelect(`data-visit-r="${esc(p.url)}" aria-label="Ditt betyg för ${esc(p.addr)}"`, v.r ?? "")}
        <input type="text" data-visit-note="${esc(p.url)}" value="${esc(v.note || "")}" placeholder="Anteckningar från visningen"></div>` : ""}
    </div>
    <div class="sc-act">
      ${v ? `<button class="btn ghost" data-act="unwent" data-key="${esc(p.url)}">Ångra besöket</button>` : `<button class="btn" data-act="went" data-key="${esc(p.url)}" data-at="${s ? s.start : isoLocal(new Date())}">Jag var där</button>`}
      <button class="heart" data-act="${tracked ? "untrack" : "track"}" data-key="${esc(p.url)}" aria-pressed="${tracked}" aria-label="${tracked ? "Ta bort " + esc(p.addr) + " från Sparade" : "Spara " + esc(p.addr)}" title="${tracked ? "Sparad. Tryck för att ta bort." : "Spara"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8.2 3.4 4.5 7 4.5c2.1 0 3.7 1.2 5 3 1.3-1.8 2.9-3 5-3 3.6 0 5.5 3.7 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg></button>
    </div>
  </article>`;
}
/* ---------- The map: apartments as dots, each area drawn around its apartments in its rating's colour ---------- */
const MAP = { map: null, el: null, layer: null, sig: "", fitted: false, areas: null };
// Districts' official outlines and the neighbourhoods inside them (areas.geojson, built from OpenStreetMap)
fetch("/areas.geojson").then((r) => (r.ok ? r.json() : null)).then((g) => { MAP.areas = g; MAP.sig = ""; placeAll(); refresh(); }).catch(() => {});
function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inGeometry(x, y, g) {
  const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
  return polys.some(([outer, ...holes]) => inRing(x, y, outer) && !holes.some((h) => inRing(x, y, h)));
}
// The map and the cards use the same names: each apartment is named by the neighbourhood it lies in
function placeAll() {
  if (!MAP.areas) return;
  const hoods = MAP.areas.features.filter((f) => f.properties.kind === "area");
  for (const p of Object.values(LIST.items)) {
    if (!p.lat || p.outside) continue;
    const f = hoods.find((h) => inGeometry(p.lon, p.lat, h.geometry));
    if (f) { p.area = f.properties.name; p.group = f.properties.district; }
  }
}
function ratingColour(r) {
  const c = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  return r === "never" ? c("--negative") : r === "" ? c("--muted") : +r >= 4 ? c("--positive") : +r === 3 ? c("--data") : c("--warning");
}
const ratingLabel = (r) => (r === "never" ? "Aldrig här" : r ? r + "/5" : "Inte betygsatt");
function metres(a, b) { // short distances in Stockholm, near enough for drawing
  const dy = (a[0] - b[0]) * 111320, dx = (a[1] - b[1]) * 111320 * Math.cos((a[0] * Math.PI) / 180);
  return Math.hypot(dx, dy);
}
function drawMap() {
  const el = document.getElementById("map");
  if (!el || !window.L) return;
  if (MAP.el !== el) {
    if (MAP.map) MAP.map.remove();
    MAP.map = L.map(el, { scrollWheelZoom: false, zoomControl: true }).setView([59.325, 18.065], 13);
    MAP.tiles = null;
    Object.assign(MAP, { el, layer: L.layerGroup().addTo(MAP.map), sig: "", fitted: false });
  }
  // Stadia Maps' quiet greys over OpenStreetMap data, light or dark; no key is needed on localhost
  const dark = document.documentElement.dataset.theme === "dark" || (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  if (MAP.dark !== dark || !MAP.tiles) {
    if (MAP.tiles) MAP.tiles.remove();
    MAP.tiles = L.tileLayer(`https://tiles.stadiamaps.com/tiles/${dark ? "alidade_smooth_dark" : "alidade_smooth"}/{z}/{x}/{y}{r}.png`, {
      maxZoom: 20,
      attribution: '© <a href="https://stadiamaps.com/">Stadia Maps</a> · © <a href="https://openmaptiles.org/">OpenMapTiles</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(MAP.map);
    MAP.dark = dark; MAP.sig = ""; // redraw the areas in this theme's colours
  }
  const list = apartments().filter((p) => p.lat && (!S.show.hideNever || !isNever(p)));
  const sig = list.map((p) => p.url).join() + JSON.stringify(S.show.ratings) + !!MAP.areas;
  if (sig === MAP.sig) return;
  MAP.sig = sig;
  MAP.layer.clearLayers();
  const counts = {};
  for (const p of list) counts[p.area || p.group] = (counts[p.area || p.group] || 0) + 1;
  if (MAP.areas) {
    const text = getComputedStyle(document.documentElement).getPropertyValue("--text").trim();
    L.geoJSON(MAP.areas, {
      filter: (f) => f.properties.kind === "area",
      style: (f) => {
        const r = rating(f.properties.name) || rating(f.properties.group);
        return { stroke: true, color: text, weight: 0.4, opacity: 0.25, fillColor: ratingColour(r), fillOpacity: r ? 0.28 : 0.03 };
      },
      onEachFeature: (f, l) => {
        const n = f.properties.name, r = rating(n) || rating(f.properties.group), c = counts[n] || 0;
        l.bindTooltip(`<strong>${esc(n)}</strong>${n !== f.properties.district ? " · " + esc(f.properties.district) : ""}<br>${ratingLabel(r)} · ${c} ${c === 1 ? "lägenhet" : "lägenheter"}`, { sticky: true });
      },
    }).addTo(MAP.layer);
    L.geoJSON(MAP.areas, { filter: (f) => f.properties.kind === "district", interactive: false,
      style: { color: text, weight: 1.4, opacity: 0.55, fill: false } }).addTo(MAP.layer);
  }
  for (const p of list) {
    const r = rating(p.area) || rating(p.group);
    L.circleMarker([p.lat, p.lon], { radius: 5, color: getComputedStyle(document.documentElement).getPropertyValue("--surface").trim(), weight: 1.5, fillColor: r ? ratingColour(r) : getComputedStyle(document.documentElement).getPropertyValue("--text").trim(), fillOpacity: 0.9 })
      .bindPopup(`<strong>${esc(p.addr)}</strong><br>${esc(p.area || p.group || "")}${p.price ? " · " + kr(p.price) : ""}${(p.shows || [])[0] ? "<br>Visning " + fmtShort(p.shows[0].start) + " " + p.shows[0].start.slice(11) : ""}<br><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.agent)} ↗</a>`)
      .addTo(MAP.layer);
  }
  if (!MAP.fitted && list.length) { MAP.map.fitBounds(L.latLngBounds(list.map((p) => [p.lat, p.lon])).pad(0.08)); MAP.fitted = true; }
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawMap());
function mapPanel() {
  if (!apartments().some((p) => p.lat)) return "";
  const key = [["5", "4–5"], ["3", "3"], ["2", "1–2"], ["never", "Aldrig här"], ["", "Inte betygsatt"]];
  return `<section class="panel map-panel">
    <div id="map" role="img" aria-label="Karta över lägenheterna och dina betygsatta områden"></div>
    <div class="legend">${key.map(([r, l]) => `<span><i style="background:${r === "" ? "var(--text)" : r === "never" ? "var(--negative)" : +r >= 4 ? "var(--positive)" : +r === 3 ? "var(--data)" : "var(--warning)"}"></i>${l}</span>`).join("")}<span class="dim">Stadsdelarna följer Stockholms officiella gränser, strandkanten inräknad. Delområden har inga officiella gränser, så vart och ett täcker den del av stadsdelen som ligger närmast dess mitt (Nytorget för SoFo, torget för Mariatorget). Ett delområde du inte betygsatt får stadsdelens betyg.</span></div>
  </section>`;
}
// Gallery photos and descriptions are built when you open them, not for every card up front
function fillDetails(d) {
  if (d.dataset.fill === "undated") { // not one apartment's section, so before looking one up
    const a = affordability(), cr = chosenRate();
    d.querySelector(".fill").innerHTML = apartments().filter((p) => !(p.shows || []).length && (!S.show.hideNever || !isNever(p))).map((p) => showCard(p, null, a, cr)).join("");
    return;
  }
  const p = LIST.items[d.dataset.key]; if (!p) return;
  if (d.dataset.fill === "plan") d.querySelector(".fill").innerHTML = p.plans.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener" title="Öppna i full storlek"><img src="${esc(u)}" alt="Planlösning för ${esc(p.addr)}" loading="lazy" referrerpolicy="no-referrer"></a>`).join("");
  else if (d.dataset.fill === "gallery") d.querySelector(".strip").innerHTML = (p.photos || []).slice(1, 16).map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer"></a>`).join("");
  else d.querySelector(".fill").innerHTML = (p.desc || "").split("\n\n").map((t) => `<p>${esc(t)}</p>`).join("");
}
const SHOW_STEP = 30; // cards drawn at a time
let showLimit = SHOW_STEP;
function showView() {
  const sh = S.show, a = affordability(), cr = chosenRate();
  const [from, to] = showWindow(sh.days, new Date());
  const list = apartments();
  const rows = [];
  for (const p of list) for (const s of showingsIn(p, from, to)) rows.push({ p, s });
  const visible = rows.filter(({ p }) => !sh.hideNever || !isNever(p)).sort((x, y) => (x.s.start < y.s.start ? -1 : 1));
  const hidden = rows.filter(({ p }) => isNever(p)).length;
  const days = {};
  for (const r of visible) (days[r.s.start.slice(0, 10)] = days[r.s.start.slice(0, 10)] || []).push(r);
  const undated = list.filter((p) => !(p.shows || []).length && (!sh.hideNever || !isNever(p)));
  const body = !Object.keys(LIST.items).length
    ? `<div class="note">Inga lägenheter än. ${LOCAL ? "Tryck på Kör nu, eller vänta på morgonkörningen." : "Öppna planeraren från den lokala servern för att se dem."}</div>`
    : !visible.length ? `<div class="note">Inga visningar under perioden${hidden ? `, förutom ${hidden} i områden du satt till Aldrig här` : ""}.</div>`
    : (() => {
        let left = showLimit;
        const html = Object.entries(days).map(([d, rs]) => {
          if (left <= 0) return "";
          const shown = rs.slice(0, left); left -= shown.length;
          return `<h3 class="show-day">${fmtDay(d)} <span class="dim">${rs.length} ${rs.length > 1 ? "visningar" : "visning"}</span></h3>${shown.map(({ p, s }) => showCard(p, s, a, cr)).join("")}`;
        }).join("");
        return html + (visible.length > showLimit ? `<button class="btn more" data-act="show-more">Visa ${Math.min(SHOW_STEP, visible.length - showLimit)} till${visible.length - showLimit > SHOW_STEP ? ` (${visible.length - showLimit} kvar)` : ""}</button>` : "");
      })();
  return `
    <div class="lead"><h1>Visningar</h1>
    <p>Lägenheter innanför tullarna med visning, hittade på mäklarnas egna sajter varje morgon och jämförda med din budget. Betygsätt områden allteftersom: platser du sätter till <strong>Aldrig här</strong> försvinner ur listan.</p></div>
    <div class="bench show">
      <div class="stack">${crawlPanel()}${filterPanel()}${placesPanel()}${myAreasPanel()}${areasPanel(list)}</div>
      <div>
        <div class="row" style="justify-content:space-between;margin-bottom:4px">
          <div class="seg">${[["week", "Nästa vecka"], ["8", "Närmaste 8 dagarna"], ["all", "Alla kommande"]].map(([k, l]) => `<button data-set="show.days" data-val="${k}" aria-pressed="${sh.days === k}">${l}</button>`).join("")}</div>
          ${hidden ? `<label class="dim" style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" data-check="show.hideNever" ${sh.hideNever ? "checked" : ""}> Dölj ${hidden} i Aldrig här-områden</label>` : ""}
        </div>
        ${mapPanel()}
        ${body}
        ${undated.length ? `<details class="undated" data-fill="undated"><summary>${undated.length} ${undated.length > 1 ? "lägenheter" : "lägenhet"} utan visning än</summary><div class="fill"></div></details>` : ""}
      </div>
    </div>`;
}
function showInput(t) {
  if (t.dataset.place) { const x = (S.show.places || []).find((y) => y.id === t.dataset.place); if (x) x[t.dataset.k] = t.value; changed(false); return true; }
  if (t.dataset.hoodNote != null) { const n = t.dataset.hoodNote; S.show.ratings[n] = { ...(S.show.ratings[n] || {}), note: t.value }; changed(false); return true; }
  if (t.dataset.visitNote != null) { const v = S.show.visits[t.dataset.visitNote]; if (v) v.note = t.value; changed(false); return true; }
  return t.dataset.hoodR != null || t.dataset.visitR != null;
}
function showChange(t) {
  if (t.dataset.place) { if (t.dataset.k !== "name") lookUpTrips(); changed(false); return true; }
  if (t.dataset.hoodR != null) { const n = t.dataset.hoodR; S.show.ratings[n] = { ...(S.show.ratings[n] || {}), r: t.value }; changed(true); return true; }
  if (t.dataset.visitR != null) { const v = S.show.visits[t.dataset.visitR]; if (v) v.r = t.value; changed(true); return true; }
  return false;
}
function showClick(a) {
  const p = LIST.items[a.dataset.key];
  switch (a.dataset.act) {
    case "crawl-start": startScrape(); return true;
    case "show-more": showLimit += SHOW_STEP; refresh(); return true;
    case "add-place": (S.show.places = S.show.places || []).push({ id: Math.random().toString(36).slice(2, 9), name: "", addr: "", arrive: "08:00" }); return false;
    case "del-place": S.show.places = (S.show.places || []).filter((x) => x.id !== a.dataset.id); return false;
    case "went": if (p) S.show.visits[p.url] = { at: a.dataset.at, r: "", note: "", addr: p.addr, area: p.area || p.group }; return false;
    case "unwent": delete S.show.visits[a.dataset.key]; return false;
    case "untrack": S.apts = S.apts.filter((x) => x.link !== a.dataset.key); setTimeout(flush); return false;
    case "track":
      if (p && (S.show.places || []).some((x) => x.addr)) setTimeout(lookUpTrips); // the trips to your addresses, for this apartment
      if (p) S.apts.unshift({ id: Math.random().toString(36).slice(2, 9), address: `${p.addr}, ${p.area || p.group || ""}`, price: p.price || null, bid: p.price || null,
        avgift: p.avgift || null, kvm: p.kvm || null, rooms: p.rooms || null, debtKvm: null, link: p.url, status: "Viewing booked",
        photo: (p.photos || [])[0] || null, agent: p.agent || null });
      return false;
  }
  return null;
}
VIEWS.show = showView;

/* ---------- Events ---------- */
document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-sec]"); if (!b) return;
  const sec = b.dataset.sec;
  go((S.lastTab || {})[sec] || SECTIONS[sec][1][0][0]);
});
app.addEventListener("input", (e) => {
  const t = e.target;
  if (showInput(t)) return;
  const val = t.type === "range" ? +t.value : t.hasAttribute("data-num") ? parseNum(t.value) : t.value;
  if (val === undefined) return; // half-typed number such as "6," or "-"
  if (t.dataset.path) {
    set(t.dataset.path, val);
    if (S.example && t.dataset.path.startsWith("fin.")) S.example = false;
    if (t.tagName === "SELECT" || t.id === "f-areaid") return changed(true);
    return changed(false);
  }
  if (t.dataset.apt) {
    const p = S.apts.find((x) => x.id === t.dataset.apt); if (!p) return;
    p[t.dataset.k] = val; if (p.example && t.dataset.k !== "status") p.example = false;
    return changed(false);
  }
  if (t.dataset.five) { S.five.scen[t.dataset.five].dr[+t.dataset.y] = val ?? 0; return changed(false); }
  const f = S.furn;
  for (const k of ["qty", "price"]) if (t.dataset[k]) {
    f.items[t.dataset[k]] = { ...(f.items[t.dataset[k]] || {}), [k]: val };
    return changed(false);
  }
  const xid = t.dataset.xname || t.dataset.xprice;
  if (xid) { const x = f.extra.find((i) => i.id === xid); if (x) x[t.dataset.xname ? "name" : "price"] = val; return changed(false); }
});
// Fill in a gallery, description or list when it's opened ("toggle" doesn't bubble, so listen while it travels down)
app.addEventListener("toggle", (e) => { const d = e.target; if (d.open && d.dataset && d.dataset.fill) fillDetails(d); }, true);
app.addEventListener("change", (e) => {
  const t = e.target;
  if (showChange(t)) return;
  if (t.dataset.check) { set(t.dataset.check, t.checked); return changed(true); }
  if (t.dataset.have) { S.furn.items[t.dataset.have] = { ...(S.furn.items[t.dataset.have] || {}), have: t.checked }; return changed(true); }
  if (t.dataset.xhave) { const x = S.furn.extra.find((i) => i.id === t.dataset.xhave); if (x) x.have = t.checked; return changed(true); }
  if (t.dataset.step) { S.steps[t.dataset.step] = t.checked; return changed(true); }
  if (t.dataset.xprice || t.dataset.price || t.dataset.qty) return changed(true);
});
// Tidy a number field when you leave it: "2500000" becomes "2 500 000"
app.addEventListener("focusout", (e) => {
  const t = e.target;
  if (!t.hasAttribute || !t.hasAttribute("data-num")) return;
  const v = parseNum(t.value);
  if (v !== undefined) t.value = fmtIn(v);
});
app.addEventListener("click", (e) => {
  const g = e.target.closest("[data-goto]"); if (g) return go(g.dataset.goto);
  const s = e.target.closest("[data-set]");
  if (s) { const v = s.dataset.val; set(s.dataset.set, /^\d+$/.test(v) && ["fin.buyers", "value.win"].includes(s.dataset.set) ? +v : v); return changed(true); }
  const th = e.target.closest("th[data-sort]"); if (th) { S.rates.sort = th.dataset.sort; return changed(true); }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const sc = showClick(a); if (sc === true) return; if (sc === false) return changed(true);
  if (a.dataset.act === "use-searchto") { S.show.f.maxPrice = Math.floor(affordability().max * (1 - S.search.headroom / 100) / 50000) * 50000; return changed(true); }
  const id = () => Math.random().toString(36).slice(2, 9);
  switch (a.dataset.act) {
    case "clear-example": clearExample(); break;
    case "walk-max": S.bid.walk = Math.floor(affordability().max / 5000) * 5000; break;
    case "add-apt": S.apts.unshift({ id: id(), address: "", price: null, bid: null, avgift: null, kvm: null, rooms: null, debtKvm: null, link: "", status: "Watching" }); break;
    case "del-apt": S.apts = S.apts.filter((x) => x.id !== a.dataset.id); break;
    case "add-extra": S.furn.extra.push({ id: id(), name: "", price: null, qty: 1, have: false }); break;
    case "del-extra": S.furn.extra = S.furn.extra.filter((x) => x.id !== a.dataset.id); break;
  }
  changed(true);
});

// Save at once when the page is hidden or closed, so a change made just before isn't lost
addEventListener("pagehide", () => { if (saveTimer) flush(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveTimer) flush(); });

render();
initStore().then(async () => {
  await loadList();
  loadTravel();
  pollStatus();
});
